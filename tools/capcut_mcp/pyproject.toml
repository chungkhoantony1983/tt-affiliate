[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capcut-mcp"
version = "0.1.0"
description = "MCP server that builds CapCut desktop drafts (clips, images, text, subtitles, audio)"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
probe = ["imageio-ffmpeg"]
test = ["pytest", "pillow", "imageio-ffmpeg"]

[project.scripts]
capcut-mcp = "capcut_mcp.server:main"

[tool.setuptools]
packages = ["capcut_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
