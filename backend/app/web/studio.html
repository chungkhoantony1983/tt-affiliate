<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio duyệt video</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
  --accent: #e0245e; --accent-ink: #ffffff; --soft: #f1efea; --focus: #2f6fed;
  --ok: #1f7a3f; --ok-bg: #e3f4e8; --warn: #8a5a00; --warn-bg: #fdf1d6;
  --bad: #b3261e; --bad-bg: #fde7e5; --info-bg: #e8f0fe; --info: #1f4fb4;
  --fs-caption: 12px; --fs-note: 13px; --fs-small: 14px; --fs-body: 15px;
  --fs-h3: 17px; --fs-h1: 20px; --fs-h2: 22px;
  --radius: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416; --panel: #1e1e21; --ink: #f2f2f3; --muted: #a0a0a8; --line: #33333a;
    --accent: #ff4f86; --accent-ink: #1a0610; --soft: #26262a; --focus: #7aa5ff;
    --ok: #7ad69a; --ok-bg: #173022; --warn: #f3c25b; --warn-bg: #352a10;
    --bad: #ff8a80; --bad-bg: #3a1a18; --info-bg: #1b2740; --info: #9dbbff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: var(--fs-h1); }
header p { margin: 0; color: var(--muted); font-size: var(--fs-small); }
header .quota { flex: 1 1 100%; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
.layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 58px); }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto;
  max-height: calc(100vh - 58px); position: sticky; top: 0; }
aside h2 { font-size: var(--fs-note); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 16px 8px; }
.aside-top { padding: 14px 12px 4px; }
.aside-top .btn { width: 100%; min-height: 44px; font-size: var(--fs-body); display: flex; align-items: center; justify-content: center; gap: 6px; }
.vlist { list-style: none; margin: 0; padding: 0 8px 16px; }
.vlist button { width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent;
  border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.vlist button:hover { background: var(--soft); }
.vlist button[aria-current="true"] { background: var(--soft); border-left-color: var(--accent); }
.vlist .t { font-weight: 600; }
.vlist .m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--fs-note); color: var(--muted); }
.badge { display: inline-block; font-size: var(--fs-caption); font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.b-review { background: var(--warn-bg); color: var(--warn); }
.b-needs_images { background: var(--bad-bg); color: var(--bad); }
.b-approved { background: var(--ok-bg); color: var(--ok); }
.b-view_only { background: var(--soft); color: var(--muted); }
.b-voice { background: var(--info-bg); color: var(--info); }
.b-layout { background: var(--info-bg); color: var(--info); }
main { padding: 20px 24px 120px; min-width: 0; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.back { display: none; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.title-row h2 { margin: 0; font-size: var(--fs-h2); }
.detail { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 24px; align-items: start; }
.player { position: sticky; top: 16px; }
video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: var(--radius); display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h3 { margin: 0 0 4px; font-size: var(--fs-h3); }
.card .sub { margin: 0 0 12px; color: var(--muted); font-size: var(--fs-small); }
label.f { display: block; font-size: var(--fs-small); font-weight: 600; margin: 12px 0 4px; }
input[type=text], input[type=number], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg); font: inherit; color: inherit; }
textarea { resize: vertical; min-height: 64px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.hint { font-size: var(--fs-note); color: var(--muted); margin-top: 4px; }
.price-preview { font-size: var(--fs-small); margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: var(--soft); }
.price-preview.bad-text { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.source-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.source-tabs .btn { flex: 1 1 200px; text-align: center; }
.source-tabs .btn[aria-pressed="true"] { background: var(--info-bg); color: var(--info); border-color: var(--focus); }
.create-wrap { max-width: 780px; }
.slot-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg);
  display: grid; gap: 6px; justify-items: center; flex: 1 1 140px; max-width: 220px; }
.slot-card .slot-title { font-size: var(--fs-note); font-weight: 600; text-align: center; }
.slot-card .thumb { width: 104px; aspect-ratio: 1; }
.slot-card .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.style-choices { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.style-choice { flex: 1 1 220px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: var(--bg); cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
.style-choice input { margin-top: 4px; }
.style-choice b { display: block; font-size: var(--fs-small); }
.style-choice span { display: block; font-size: var(--fs-note); color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px;
  cursor: pointer; font-weight: 600; min-height: 42px; }
.btn:hover:not(:disabled) { background: var(--soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: var(--fs-small); }
.scene { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.scene:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.scene-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.scene-head b { font-size: var(--fs-body); }
.chip { font-size: var(--fs-caption); padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.chip.re { background: var(--info-bg); color: var(--info); font-weight: 600; }
.scene-img { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.scene-img .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 72px; aspect-ratio: 9 / 16; border-radius: 8px; object-fit: cover; background: var(--soft);
  border: 1px dashed var(--line); display: grid; place-items: center; font-size: var(--fs-caption); color: var(--muted); text-align: center; }
.pimgs { display: flex; gap: 14px; flex-wrap: wrap; }
.pimg { display: grid; gap: 6px; justify-items: center; }
.pimg .thumb { width: 96px; aspect-ratio: 1; }
.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: var(--fs-body); }
.banner.info { background: var(--info-bg); color: var(--info); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner .acts { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.banner .acts .btn { max-width: 100%; text-align: left; }
.banner .hint { color: inherit; }
dialog .extra { font-weight: 600; color: var(--warn); }
.banner details { margin-top: 8px; font-size: var(--fs-note); }
.banner pre { white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; margin: 6px 0 4px; color: var(--ink); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
  border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.actionbar { position: fixed; left: 320px; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5; }
.actionbar[hidden] { display: none; }
.actionbar .why { color: var(--muted); font-size: var(--fs-small); flex: 1 1 200px; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink);
  max-width: 440px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h3 { margin-top: 0; }
dialog .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.copy-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.fact { border-top: 1px solid var(--line); padding: 10px 0; font-size: var(--fs-small); }
.fact:first-of-type { border-top: 0; }
.fact q { display: block; color: var(--muted); font-size: var(--fs-note); margin: 4px 0; quotes: none; }
.credit { font-size: var(--fs-note); color: var(--muted); padding: 4px 0; }
.fact.hl { background: var(--info-bg); border-radius: 8px; padding-left: 8px; }
button.chip { border: 0; cursor: pointer; }
.cmd { user-select: all; white-space: pre-wrap; word-break: break-all; min-width: 0; max-width: 100%; }
.banner { min-width: 0; overflow-wrap: anywhere; }
.chip.stale { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.detail > * { min-width: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0 0 14px; padding: 0; font-size: var(--fs-small); }
.steps li { padding: 4px 12px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.steps li.on { background: var(--info-bg); color: var(--info); font-weight: 700; }
.tiles { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.tile { flex: 1 1 200px; text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: var(--radius);
  padding: 14px; cursor: pointer; display: grid; gap: 4px; min-height: 84px; }
.tile b { font-size: var(--fs-body); }
.tile span { font-size: var(--fs-note); color: var(--muted); }
.tile[aria-pressed="true"] { border-color: var(--focus); background: var(--info-bg); }
.tile:disabled { opacity: .55; cursor: not-allowed; }
.noplayer { aspect-ratio: 9 / 16; border-radius: var(--radius); background: var(--soft); border: 1px dashed var(--line);
  display: grid; place-items: center; color: var(--muted); text-align: center; padding: 12px; }
.lscene { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--bg); }
.lscene.open { border-color: var(--focus); }
.lscene.bad { border-color: var(--bad); }
.lhead { width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; cursor: pointer; display: flex;
  gap: 8px; align-items: center; flex-wrap: wrap; border-radius: 10px; min-height: 44px; }
.lhead .lsum { flex: 1 1 160px; min-width: 0; color: var(--muted); font-size: var(--fs-small); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.lhead .lsum.err { color: var(--bad); font-weight: 600; }
.lbody { padding: 0 12px 12px; }
.lbody small { font-weight: 400; color: var(--muted); }
.lbody details { margin-top: 10px; }
.lbody summary { cursor: pointer; font-size: var(--fs-small); font-weight: 600; min-height: 32px; }
.ferr { color: var(--bad); font-size: var(--fs-small); margin-top: 4px; font-weight: 600; }
.lacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.lacts .btn { min-height: 44px; min-width: 44px; }
.lscene .invalid { border-color: var(--bad); background: var(--bad-bg); }
.add-here { display: block; width: 100%; margin: 0 0 8px; background: none; border: 1px dashed var(--line); border-radius: 10px;
  color: var(--muted); min-height: 40px; cursor: pointer; font-weight: 600; }
.add-here:hover:not(:disabled) { background: var(--soft); }
.add-here:disabled { opacity: .45; cursor: not-allowed; }
.imgpick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.imgpick label { display: grid; gap: 4px; justify-items: center; cursor: pointer; font-size: var(--fs-caption); border: 2px solid var(--line);
  border-radius: 10px; padding: 4px; min-width: 64px; }
.imgpick label:has(input:checked) { border-color: var(--focus); background: var(--info-bg); }
.imgpick img, .imgpick .auto { width: 56px; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: var(--soft);
  display: grid; place-items: center; font-size: var(--fs-caption); text-align: center; }
.imgpick input { margin: 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--bad); text-decoration: underline; cursor: pointer; font: inherit; font-weight: 600; text-align: left; }
.actionbar .quiet { margin-left: auto; color: var(--muted); }
main.busy .lscene, main.busy .add-here { pointer-events: none; opacity: .6; }
@media (max-width: 900px) {
  .detail { grid-template-columns: minmax(0, 1fr); }
  .player { position: static; max-width: 340px; margin: 0 auto; width: 100%; }
}
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  aside { max-height: none; position: static; border-right: 0; }
  body.has-detail aside { display: none; }
  body:not(.has-detail) main { display: none; }
  main { padding: 16px 16px 240px; }
  .back { display: inline-flex; margin-bottom: 10px; }
  .actionbar { left: 0; padding: 10px 16px; }
  .actionbar .btn { flex: 1 1 auto; }
  .actionbar .quiet { flex: 0 0 auto; }
  .btn.small { min-height: 44px; }
  header { padding: 12px 16px; }
  .slot-card { max-width: none; }
}
</style>
</head>
<body>
<header>
  <h1>Studio duyệt video</h1>
  <p>Tạo video mới, soạn bố cục, xem và sửa chữ, dựng lại, rồi duyệt.</p>
  <p class="quota" id="quota" role="status">Đang xem số lượt giọng Gemini…</p>
</header>
<div class="layout">
  <aside>
    <div class="aside-top">
      <button class="btn primary" id="b-new-video">+ Tạo video mới</button>
    </div>
    <h2>Video trên máy</h2>
    <p class="hint" id="counts" style="margin:0 16px 6px"></p>
    <ul class="vlist" id="list"><li class="empty">Đang tải…</li></ul>
  </aside>
  <main id="main"><p class="empty">Chọn một video ở danh sách bên trái hoặc bấm <b>+ Tạo video mới</b>.</p></main>
</div>
<div class="actionbar" id="bar" hidden></div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h3 id="confirm-title"></h3>
  <p id="confirm-text"></p>
  <p class="extra" id="confirm-extra" hidden></p>
  <div class="acts">
    <button class="btn" id="confirm-no">Để sau</button>
    <button class="btn primary" id="confirm-yes"></button>
  </div>
</dialog>
<div class="sr" aria-live="polite" id="live"></div>

<script>
"use strict";
// Travel folders (DR-0002). All strings from the folder go through esc(); links need https:// (T-17).
const TRAVEL_KINDS = { hook: "Mở đầu", answer: "Trả lời", outro: "Kết" };

function safeLink(url, label) {
  const u = String(url || "");
  if (!u.startsWith("https://")) return esc(label || u);
  return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label || u)}</a>`;
}

function langName(code) {
  try {
    const n = new Intl.DisplayNames(["vi"], { type: "language" }).of(code);
    if (n && n.toLowerCase() !== String(code).toLowerCase()) return n.charAt(0).toLowerCase() + n.slice(1);
  } catch { /* fall through */ }
  return String(code).toUpperCase();
}

const shq = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";

// Ready-to-paste Terminal command, with cd to the project root (the Terminal may be anywhere)
function refreshCmd(root, folder, confirmIds) {
  const base = `cd ${shq(root)} && .venv/bin/python demo.py --travel --refresh-facts ${shq("storage/videos/" + folder)}`;
  return confirmIds && confirmIds.length ? `${base} --confirm ${confirmIds.map(shq).join(",")}` : base;
}

function cmdBlock(root, folder, confirmIds) {
  let html = `<div class="hint">Chép lệnh này, dán vào Terminal rồi nhấn Enter:</div><pre class="cmd">${esc(refreshCmd(root, folder, []))}</pre>`;
  if (confirmIds && confirmIds.length) {
    html += `<div class="hint">Dữ kiện nhập tay (${esc(confirmIds.join(", "))}) cần bạn xác nhận đã kiểm lại trang nguồn. Sau khi kiểm, dùng lệnh này:</div>`
      + `<pre class="cmd">${esc(refreshCmd(root, folder, confirmIds))}</pre>`;
  }
  return html + "<div>Chạy xong, quay lại đây bấm Duyệt lần nữa.</div>";
}

function travelStaleBanner(v) {
  const ids = v.stale_ids || [];
  if (!ids.length) return "";
  const labels = v.stale_labels || {};
  const list = ids.map((id) => labels[id] ? `${id} (${labels[id]})` : id).join("; ");
  return `<div class="banner warn">Có dữ kiện quá 30 ngày: ${esc(list)}. Bạn sẽ không duyệt được cho đến khi làm mới nguồn (mất khoảng 1 phút, miễn phí).`
    + cmdBlock(v.repo_root, v.folder, v.confirm_ids) + "</div>";
}

function travelSubsOf(s) {
  const out = {};
  for (const lang of current.subtitle_langs) {
    const el = $(`[data-sub="${s.index}"][data-lang="${lang}"]`);
    if (el) out[lang] = el.value;
  }
  return out;
}

function travelSubsChanged(s, subs) {
  return Object.keys(subs || {}).some((lang) => norm(subs[lang]) !== norm((s.subs || {})[lang]));
}

function travelEditNote() {
  const n = current.segments.filter((s) =>
    norm($(`[data-line="${s.index}"]`).value) !== norm(s.line)
    || ($(`[data-text="${s.index}"]`).value || "").trim() !== (s.text || "")
    || travelSubsChanged(s, travelSubsOf(s))).length;
  return n ? `<div class="banner info">Bạn đã sửa ${n} cảnh, bấm <b>Dựng lại video</b> để đưa vào video.</div>` : "";
}

function creditLine(c) {
  return `${safeLink(c.page, c.provider || "Nguồn")} · ${esc(c.author || "không rõ tác giả")} · ${esc(c.license || "không rõ giấy phép")}`;
}

function travelSceneMarkup(s) {
  const subs = current.subtitle_langs.map((lang) => `
    <label class="f" for="sub-${s.index}-${esc(lang)}">Phụ đề ${esc(langName(lang))}</label>
    <textarea id="sub-${s.index}-${esc(lang)}" rows="2" data-sub="${s.index}" data-lang="${esc(lang)}">${esc((s.subs || {})[lang] || "")}</textarea>`).join("");
  const hint = current.subtitle_langs.length ? '<div class="hint">Sửa số thì phải trùng số trong Dữ kiện.</div>' : "";
  const ids = (s.fact_ids || []).map((id) => `<button type="button" class="chip" data-factref="${esc(id)}" title="Xem dữ kiện này">Dữ kiện: ${esc(id)}</button>`).join("");
  const clips = current.credits.filter((c) => (c.scenes || []).includes(s.index + 1))
    .map((c) => `<div class="hint">Hình cảnh này: ${creditLine(c)}</div>`).join("");
  return `<div class="scene" data-scene="${s.index}">
    <div class="scene-head"><b>Cảnh ${s.index + 1}</b><span class="chip">${esc(TRAVEL_KINDS[s.kind] || "Cảnh")}</span>${ids}
      <span class="chip re" data-re hidden>Sẽ đọc lại</span></div>
    <label class="f" for="line-${s.index}">Lời đọc</label>
    <textarea id="line-${s.index}" rows="3" data-line="${s.index}">${esc(s.line)}</textarea>
    <label class="f" for="text-${s.index}">Chữ trên màn hình (ngắn, tối đa ${s.kind === "hook" ? 10 : 6} từ)</label>
    <input type="text" id="text-${s.index}" data-text="${s.index}" value="${esc(s.text)}">
    ${subs}${hint}${clips}</div>`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-factref]");
  if (!b) return;
  const el = [...document.querySelectorAll("[data-fact]")].find((x) => x.dataset.fact === b.dataset.factref);
  if (!el) return;
  document.querySelectorAll(".fact.hl").forEach((x) => x.classList.remove("hl"));
  el.classList.add("hl");
  el.scrollIntoView({ behavior: "smooth", block: "center" });
});

function travelCards(v) {
  const facts = (v.facts || []).map((f) => `<div class="fact" data-fact="${esc(f.id)}">
      <div><b>${esc(f.claim)}</b> ${f.manual ? '<span class="chip">nhập tay</span>' : ""} ${f.stale ? '<span class="chip stale">Quá 30 ngày</span>' : ""}</div>
      <q>“${esc(f.quote)}”</q>
      <div>${f.url ? safeLink(f.url, f.source_name || f.url) : "link nguồn không có"}${f.checked_on ? ` · kiểm ngày ${esc(f.checked_on)}` : ""}${f.id ? ` · ${esc(f.id)}` : ""}</div>
    </div>`).join("");
  const dropped = v.facts_dropped
    ? `<div class="banner warn">Có ${esc(v.facts_dropped)} dữ kiện không hiện vì link nguồn không hợp lệ hoặc không thuộc nguồn cho phép. `
      + "Nhờ người phụ trách kỹ thuật kiểm tra, hoặc xoá trạng thái trong tab Travel và tạo lại video. Đừng duyệt khi chưa kiểm lại nguồn.</div>" : "";
  const credits = (v.credits || []).map((c) => `<div class="credit">${c.scenes && c.scenes.length ? "Cảnh " + esc(c.scenes.join(", ")) + ": " : ""}${creditLine(c)}</div>`).join("");
  return `<div class="card"><h3>Dữ kiện và nguồn</h3>
      <p class="sub">Kiểm từng dữ kiện với trang nguồn trước khi duyệt. Lời đọc chỉ được dùng các con số có ở đây.</p>
      ${dropped}${facts || '<div class="hint">Chưa có dữ kiện nào.</div>'}</div>
    <div class="card"><h3>Hình và bản quyền</h3>
      <p class="sub">Nguồn clip và ảnh trong video. Muốn thay clip sai thì ghi lại số cảnh ở đây.</p>
      ${credits || '<div class="hint">Chưa có thông tin nguồn hình.</div>'}
      <div class="hint">Ảnh giấy phép CC BY / CC BY-SA đã có tên tác giả hiện trên video.</div></div>`;
}

function travelErrorHtml(job) {
  const stale = job.error_kind === "facts_stale";
  const lines = (job.notices || []).filter((l) => l.startsWith(stale ? "[FACTS_STALE] " : "[FACT_CHECK] "));
  const shown = lines.map((l) => l.replace(/^\[[A-Z_]+\]\s*/, "")).slice(0, 6);
  const pre = shown.length ? `<pre>${esc(shown.join("\n"))}</pre>` : "";
  if (stale) {
    const m = /--confirm[ =]([\w,-]+)/.exec(lines.join(" "));
    const confirmIds = m ? m[1].split(",").filter(Boolean) : (current && current.confirm_ids) || [];
    return "Chưa duyệt được: có dữ kiện dễ đổi (visa, phí, giá…) đã kiểm quá 30 ngày." + pre
      + cmdBlock(job.repo_root || "", job.folder, confirmIds);
  }
  return (shown.length ? "Con số trong video chưa khớp nguồn, nên chưa dựng lại:" + pre
      : "Có con số trong lời đọc hoặc phụ đề không có trong nguồn, nên chưa dựng lại. ")
    + "Video và giọng cũ vẫn giữ nguyên. Sửa rồi bấm Lưu, rồi Dựng lại video.";
}
</script>
<script>
"use strict";
const API = "/api/studio";
const LABELS = { layout: "Đang soạn bố cục", review: "Chờ duyệt đăng", needs_images: "Cần ảnh", approved: "Đã duyệt", view_only: "Chỉ xem" };
const SPEAKERS = { narrator: "Người dẫn", con_gai: "Con gái", con_trai: "Con trai", me: "Mẹ", bo: "Bố", ba: "Bà", ong: "Ông" };
const KINDS = { story: "Tiểu phẩm", product: "Sản phẩm", cta: "Kêu gọi mua", topic: "Nội dung", outro: "Kết" };
const VOICE_BADGES = { free: "Giọng miễn phí", backup: "Gemini phụ" };
const VOICE_NAMES = { main: "Gemini", backup: "Gemini phụ", free: "giọng miễn phí" };
const VN_DIGITS = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];

let videos = [], drive = false, current = null, mode = null, dirty = false, polling = null, banner = null;

function savedKind() {
  try { return localStorage.getItem("studio.kind") === "topic" ? "topic" : "product"; } catch { return "product"; }
}
function emptyCreateState() {
  return {
    kind: savedKind(),   // "product" | "topic" (last one used)
    tName: "", tAudience: "", tOutline: "", tNotes: "", tNotesAuto: false, tVoice: "edge", tGender: "auto",
    source: "url",
    productUrl: "",
    sheetRow: "",
    sheetRows: [],
    sheetAvailable: true,
    sheetMessage: "",
    loadingPreview: false,
    name: "",
    priceRaw: "",
    slots: [null, null, null],
    style: "simple",
    voice: "",
    sellingPoints: "",
    category: "Nhà cửa",
    notes: "",
  };
}
let createState = emptyCreateState();
// Gemini voice quota estimate from GET /voice-quota (demo.py --tts-status). Model names stay out of the page text.
let quota = { available: false };

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const say = (msg) => { $("#live").textContent = msg; };
const norm = (s) => String(s || "").trim().replace(/\s+/g, " ");

function formatVndDots(n) {
  return String(Math.max(0, Math.trunc(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function readThreeDigits(num, fullHundred) {
  const h = Math.floor(num / 100), t = Math.floor((num % 100) / 10), u = num % 10;
  const out = [];
  if (h > 0 || fullHundred) out.push(VN_DIGITS[h] + " trăm");
  if (t === 0 && u > 0 && (h > 0 || fullHundred)) out.push("lẻ");
  else if (t === 1) out.push("mười");
  else if (t > 1) out.push(VN_DIGITS[t] + " mươi");
  if (u > 0) {
    if (t > 1 && u === 1) out.push("mốt");
    else if (t >= 1 && u === 5) out.push("lăm");
    else if (t > 1 && u === 4) out.push("tư");
    else out.push(VN_DIGITS[u]);
  }
  return out.join(" ");
}

function readVndWords(n) {
  n = Math.trunc(Number(n) || 0);
  if (n <= 0) return "Không đồng";
  const scales = ["", "nghìn", "triệu", "tỷ"];
  const groups = [];
  let rem = n;
  while (rem > 0) {
    groups.push(rem % 1000);
    rem = Math.floor(rem / 1000);
  }
  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] === 0) continue;
    const text = readThreeDigits(groups[i], i < groups.length - 1);
    const scale = scales[i] || "";
    parts.push(scale ? `${text} ${scale}` : text);
  }
  const s = parts.join(" ").trim() + " đồng";
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function parsePriceRaw(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return { empty: true, value: null, invalid: false };
  if (/^-/.test(s)) return { empty: false, value: -1, invalid: true };
  const digits = s.replace(/[^\d]/g, "");
  if (!digits) return { empty: true, value: null, invalid: false };
  const n = parseInt(digits, 10);
  const invalid = n < 0 || (n > 0 && n < 1000);
  return { empty: false, value: n, invalid };
}

function pricePreviewMarkup(raw, { allowEmpty = false, oldPrice = null } = {}) {
  const p = parsePriceRaw(raw);
  if (p.empty) {
    return allowEmpty
      ? '<div class="hint">Để trống nếu muốn máy tự lấy giá từ link/bảng tính, hoặc nhập <b>0</b> nếu muốn ẩn giá.</div>'
      : '<div class="price-preview"><b>Không hiện giá trên video</b></div>';
  }
  if (p.invalid) {
    return '<div class="price-preview bad-text">Giá đang dưới 1.000đ. Kiểm tra lại xem bạn có gõ thiếu 3 số 0 (ví dụ 189.000) không, hoặc nhập 0 nếu muốn ẩn giá.</div>';
  }
  let html = p.value === 0
    ? '<div class="price-preview"><b>Không hiện giá trên video</b></div>'
    : `<div class="price-preview">Sẽ hiện trên video: <b>${formatVndDots(p.value)}đ (${readVndWords(p.value)})</b></div>`;
  if (oldPrice !== null && p.value !== oldPrice) {
    html += '<div class="banner warn" style="margin-top:8px;margin-bottom:0;padding:8px 12px;font-size:var(--fs-small)">Bạn vừa đổi giá. Hãy liếc kiểm tra Lời giới thiệu và Lời đọc các cảnh bên dưới xem có câu nào đang nhắc tới giá cũ không nhé.</div>';
  }
  return html;
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.method && opts.method !== "GET") headers["X-Studio"] = "1";
  if (opts.json !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  let res;
  try { res = await fetch(API + path, { ...opts, headers }); }
  catch { throw new Error("Không kết nối được máy chủ Studio. Kiểm tra cửa sổ Terminal của Studio còn mở không."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : "Có lỗi, thử lại sau (mã " + res.status + ")");
  }
  return data;
}

function when(folder) {
  const m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/.exec(folder);
  return m ? `${m[3]}/${m[2]} ${m[4]}:${m[5]}` : "";
}

// ---------------- confirm dialog (shared: approve, switch voice, discard edits) ----------------
function ask({ title, text, extra = "", yes, no = "Để sau" }) {
  const dlg = $("#confirm");
  if (dlg.open) return Promise.resolve(false);  // one question at a time
  $("#confirm-title").textContent = title;
  $("#confirm-text").textContent = text;
  $("#confirm-extra").textContent = extra;
  $("#confirm-extra").hidden = !extra;
  $("#confirm-yes").textContent = yes;
  $("#confirm-no").textContent = no;
  return new Promise((resolve) => {
    let answer = false;
    $("#confirm-yes").onclick = () => { answer = true; dlg.close(); };
    $("#confirm-no").onclick = () => dlg.close();
    dlg.onclose = () => resolve(answer);  // also Esc
    dlg.showModal();
  });
}

// ---------------- Gemini voice quota ----------------
const two = (n) => String(n).padStart(2, "0");
const clock = (d) => `${two(d.getHours())}:${two(d.getMinutes())}`;
function dayWord(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  const days = Math.round((b - a) / 86400000);
  return days === 0 ? "hôm nay" : days === 1 ? "ngày mai" : `ngày ${two(d.getDate())}/${two(d.getMonth() + 1)}`;
}
// "khoảng 15:00 hôm nay" / "khoảng 15:00 ngày mai", by this computer's clock and date
function about(iso) {
  const d = new Date(iso);
  return iso && !isNaN(d) ? `khoảng ${clock(d)} ${dayWord(d)}` : "khi có lại lượt";
}
// "10:45" (plus the day when it is not today), for the short 60-minute pause
function until(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return "một lúc nữa";
  const day = dayWord(d);
  return clock(d) + (day === "hôm nay" ? "" : " " + day);
}

const chain = () => (quota.models || []).filter((m) => m.role === "main" || m.role === "backup");
// A short pause (60 minutes after an unclear "too many requests" answer) that ends with requests left
const paused = (m) => m.block_reason === "unknown_429" && m.blocked_until && m.used < quota.limit;
// Quota row of the model a video was voiced with (older videos: the main model)
function modelRow(name) {
  const rows = quota.models || [];
  if (!name) return rows.find((m) => m.role === "main") || null;
  return rows.find((m) => m.model === name) || { model: name, role: "other", used: 0, left: quota.limit, blocked_until: null };
}
// When this model has requests again
const backAt = (row) => (row && paused(row) ? row.blocked_until : quota.resets_at);
// When some Gemini voice can read `need` lines again
function chainBackAt(need) {
  const times = chain().filter((m) => paused(m) && quota.limit - m.used >= need).map((m) => m.blocked_until);
  return times.sort()[0] || quota.resets_at;
}

function quotaText() {
  if (!quota.available) return "Chưa xem được số lượt Gemini còn lại. Bạn vẫn dựng lại được; nếu hết lượt, máy sẽ báo và giữ nguyên video cũ.";
  if (quota.provider !== "gemini") return "Đang dùng giọng miễn phí, không giới hạn lượt.";
  const rows = chain(), main = rows.find((m) => m.role === "main"), backs = rows.filter((m) => m.role === "backup");
  if (rows.every((m) => m.left === 0)) {
    const pause = rows.filter(paused).map((m) => m.blocked_until).sort()[0];
    return pause
      ? `Giọng Gemini đang tạm nghỉ đến ${until(pause)}. Trong lúc đó video mới sẽ dùng giọng miễn phí.`
      : `Giọng Gemini đã hết lượt. Video mới sẽ dùng giọng miễn phí cho đến ${about(quota.resets_at)}.`;
  }
  const mainLeft = main ? main.left : 0;
  const left = backs.length ? `còn ${mainLeft} lượt chính và ${backs.reduce((n, m) => n + m.left, 0)} lượt phụ` : `còn ${mainLeft} lượt`;
  const enough = quota.videos_left > 0 ? `đủ cho khoảng ${quota.videos_left} video mới` : "chưa đủ cho một video mới";
  return `Giọng Gemini: ${left} · ${enough} · có lại đủ lượt lúc ${about(quota.resets_at)}`;
}

// Refreshed when the page opens, when a video opens and when a job ends
async function loadQuota() {
  try {
    const data = await api("/voice-quota");
    quota = data && data.available && Array.isArray(data.models) ? data : { available: false };
  } catch { quota = { available: false }; }
  $("#quota").textContent = quotaText();
  if (current) { paintVoice(); updateBar(); }
}

// Line at the top of a video: which voice it has, and the way back to the Gemini voice
function paintVoice() {
  const el = $("#voiceline"), v = current;
  if (!el || !v) return;
  const role = v.voice_role;
  if (!VOICE_NAMES[role]) { el.innerHTML = ""; return; }
  if (v.label === "view_only") {
    el.innerHTML = `<div class="banner info">Giọng của video: ${VOICE_NAMES[role]}</div>`;
    return;
  }
  if (role === "main") { el.innerHTML = `<div class="banner info">Giọng của video: Gemini</div>`; return; }
  if (role === "backup") { el.innerHTML = `<div class="banner warn">Giọng của video: Gemini phụ. Nghe kỹ trước khi duyệt.</div>`; return; }

  const need = v.voice_calls || 0;
  const row = quota.available ? chain().find((m) => m.left >= need) : null;   // the Gemini voice that can read the whole video
  const offer = !quota.available || quota.provider === "gemini";
  const waitFor = quota.available && offer && !row && need <= quota.limit ? about(chainBackAt(need)) : "";
  let text;
  if (v.voice_reason === "quota") {
    text = "Video này đang dùng giọng miễn phí vì lúc tạo giọng Gemini không đủ lượt. Bạn có thể duyệt luôn, hoặc "
      + (waitFor ? `đợi có lại lượt (${waitFor}) rồi ` : "") + "bấm Đọc lại toàn bộ bằng giọng Gemini.";
  } else if (v.voice_reason === "error") {
    text = "Lúc tạo, không kết nối được giọng Gemini (không phải do hết lượt). Nếu lặp lại, báo người phụ trách kỹ thuật.";
  } else {
    text = "Giọng của video: giọng miễn phí (không giới hạn lượt, kém tự nhiên hơn Gemini).";
  }
  let acts = "";
  if (offer) {
    const busy = jobBusy() ? "disabled" : "";
    if (!quota.available) {
      acts = `<div class="acts"><button class="btn small" data-act="regemini" ${busy}>Đọc lại toàn bộ bằng giọng Gemini</button></div>`;
    } else if (row) {
      acts = `<div class="acts"><button class="btn small" data-act="regemini" ${busy}>Đọc lại toàn bộ bằng giọng Gemini (dùng ${need} lượt, còn ${row.left})</button></div>`;
    } else {
      const why = waitFor ? `Chưa đủ lượt. Có lại lượt lúc ${waitFor}.`
        : "Video này có nhiều câu hơn số lượt Gemini trong một ngày.";
      acts = `<div class="acts"><button class="btn small" disabled>Đọc lại toàn bộ bằng giọng Gemini</button></div>
        <div class="hint">${esc(why)}</div>`;
    }
  }
  el.innerHTML = `<div class="banner ${v.voice_reason ? "warn" : "info"}">${esc(text)}${acts}</div>`;
}

async function askRevoice(engine) {
  if (!current || jobBusy()) return;
  const ok = engine === "gemini"
    ? await ask({ title: "Đọc lại bằng giọng Gemini?",
        text: `Cả video sẽ được đọc lại bằng giọng Gemini, dùng ${current.voice_calls} lượt. Tiếp tục?`,
        yes: "Đọc lại bằng giọng Gemini" })
    : await ask({ title: "Đổi sang giọng miễn phí?",
        text: "Cả video sẽ được đọc lại bằng giọng miễn phí, kém tự nhiên hơn giọng Gemini. Không tốn lượt Gemini. Tiếp tục?",
        yes: "Đổi sang giọng miễn phí" });
  if (ok) startRender(engine);
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  if (b.dataset.act === "revoice") askRevoice("edge");
  else if (b.dataset.act === "regemini") askRevoice("gemini");
});

// ---------------- list ----------------
async function loadList() {
  const data = await api("/videos");
  videos = data.videos; drive = data.drive;
  const ul = $("#list");
  const n = (l) => videos.filter((v) => v.label === l).length;
  $("#counts").textContent = videos.length
    ? `${n("layout")} đang soạn bố cục · ${n("review") + n("needs_images")} chờ duyệt đăng · ${n("approved")} đã duyệt` : "";
  if (!videos.length) { ul.innerHTML = '<li class="empty">Chưa có video nào trên máy.</li>'; return; }
  ul.innerHTML = videos.map((v) => `
    <li><button data-folder="${esc(v.folder)}" ${mode === "detail" && current && current.folder === v.folder ? 'aria-current="true"' : ""}>
      <span class="t">${esc(v.title)}</span>
      <span class="m"><span class="badge b-${v.label}">${LABELS[v.label]}</span>${v.has_video === false ? '<span class="chip">Chưa dựng video</span>' : ""}${
        VOICE_BADGES[v.voice_role] ? `<span class="badge b-voice">${VOICE_BADGES[v.voice_role]}</span>` : ""}${esc(when(v.folder))}</span>
    </button></li>`).join("");
}

$("#list").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-folder]");
  if (b) openVideo(b.dataset.folder);
});

$("#b-new-video").addEventListener("click", () => openCreate());

function leaveOk() {
  if (!dirty) return Promise.resolve(true);
  if (mode === "detail" && current && current.stage) {   // layout step: save instead of throwing the edits away
    return ask({ title: "Bạn đã sửa chưa lưu", text: "Bạn đã sửa chưa lưu. Lưu rồi rời trang?",
      yes: "Lưu rồi rời đi", no: "Ở lại" }).then((ok) => (ok ? layoutSave() : false));
  }
  return ask({ title: "Bỏ thay đổi chưa lưu?", text: "Bạn có thay đổi chưa lưu. Bỏ các thay đổi đó?",
    yes: "Bỏ thay đổi", no: "Ở lại" });
}

async function openVideo(folder, keepBanner = false) {
  if ((mode === "detail" && current && current.folder !== folder || mode === "create") && !(await leaveOk())) return;
  try {
    current = await api("/videos/" + encodeURIComponent(folder));
  } catch (err) { showBanner("bad", err.message); return; }
  mode = "detail";
  dirty = false;
  if (!keepBanner) banner = null;
  if (current.stage) layoutFromDetail(current); else L = null;   // the layout copy follows what the server has
  history.replaceState(null, "", "#" + encodeURIComponent(folder));
  document.body.classList.add("has-detail");
  render();
  window.scrollTo(0, 0);
  loadList();
  loadQuota();
}

// ---------------- create new video ----------------
async function openCreate(keepState = false) {
  if (!(await leaveOk())) return;
  current = null;
  mode = "create";
  dirty = false;
  if (!keepState) {
    banner = null;
    createState = emptyCreateState();
  }
  history.replaceState(null, "", "#new");
  document.body.classList.add("has-detail");
  renderCreate();
  window.scrollTo(0, 0);
  loadList();
  await loadSheetRows();
}

async function loadSheetRows() {
  try {
    const data = await api("/sheet-rows");
    createState.sheetAvailable = !!data.available;
    createState.sheetRows = data.rows || [];
    createState.sheetMessage = data.message || "";
    if (mode === "create") paintSheetSelect();
  } catch {
    createState.sheetAvailable = false;
    createState.sheetRows = [];
  }
}

function syncCreateDomToState() {
  if (mode !== "create") return;
  if ($("#t-name")) {
    createState.tName = $("#t-name").value;
    createState.tAudience = $("#t-audience").value;
    createState.tOutline = $("#t-outline").value;
    createState.tNotes = $("#t-notes").value;
    createState.tGender = $("#t-gender").value;
    const tv = document.querySelector('input[name="t-voice"]:checked');
    if (tv) createState.tVoice = tv.value;
  }
  if ($("#c-url")) createState.productUrl = $("#c-url").value;
  if ($("#c-sheet-row")) createState.sheetRow = $("#c-sheet-row").value;
  if ($("#c-name")) createState.name = $("#c-name").value;
  if ($("#c-price")) createState.priceRaw = $("#c-price").value;
  if ($("#c-points")) createState.sellingPoints = $("#c-points").value;
  if ($("#c-category")) createState.category = $("#c-category").value;
  if ($("#c-notes")) createState.notes = $("#c-notes").value;
  const st = document.querySelector('input[name="c-style"]:checked');
  if (st) createState.style = st.value;
  const vo = document.querySelector('input[name="c-voice"]:checked');
  if (vo) createState.voice = vo.value;
}

function sheetRowValidationMessage() {
  if (createState.source !== "sheet") return "";
  const raw = String(createState.sheetRow || "").trim();
  if (!raw) return "";
  const num = parseInt(raw, 10);
  if (num === 1 || num < 2 || Number.isNaN(num)) {
    return "Dòng 1 là dòng tiêu đề cột. Hãy chọn từ dòng số 2 trở đi.";
  }
  return "";
}

function paintSheetSelect() {
  const sel = $("#c-sheet-select");
  if (!sel) return;
  if (!createState.sheetAvailable || !createState.sheetRows.length) {
    sel.innerHTML = `<option value="">${esc(createState.sheetMessage || "Chưa có dòng sản phẩm nào trên Google Sheet")}</option>`;
    return;
  }
  const cur = String(createState.sheetRow || "").trim();
  const opts = ['<option value="">— Chọn nhanh một dòng sản phẩm trên Google Sheet —</option>'];
  for (const r of createState.sheetRows) {
    const priceLabel = r.price ? `${formatVndDots(r.price)}đ` : "Chưa có giá";
    const statusLabel = r.has_video ? "[Đã có video]" : "[Chưa tạo]";
    const selected = String(r.row) === cur ? "selected" : "";
    opts.push(`<option value="${r.row}" ${selected}>Dòng ${r.row} — ${esc(r.name)} (${priceLabel}) ${statusLabel}</option>`);
  }
  sel.innerHTML = opts.join("");
}

function createSlotsMarkup() {
  const labels = createState.slots.map((_, k) => (k === 0 ? "Ảnh 1 (Ảnh chính)" : `Ảnh ${k + 1}`));
  const addCard = createState.slots.length < MAX_PRODUCT_IMAGES
    ? `<div class="slot-card"><div class="slot-title">Thêm ảnh</div><div class="thumb">+</div>
        <div class="acts"><button type="button" class="btn small" data-c-add="1">+ Thêm ô ảnh</button></div></div>` : "";
  return labels.map((title, k) => {

    if (!slot) {
      return `<div class="slot-card" data-slot="${k}">
        <div class="slot-title">${esc(title)}</div>

        <div class="acts">

// Outline lines the way the server counts them (layout_rules.clean_outline)
function outlineLines(raw) {
  return String(raw || "").split("\n")
    .map((l) => l.replace(/^\s*(?:(?:cảnh|canh)\s*\d+\s*[:.)\-]|\d+\s*[.)\-:]|[-*•])\s*/i, "").replace(/\s+/g, " ").trim())
    .filter(Boolean);
}
function outlineProblem(raw) {
  const lines = outlineLines(raw), n = lines.length;
  if (n < 2 || n > 12) {
    return `Cần từ 2 đến 12 dòng. Bạn đang có ${n}. ${n > 12 ? `Xoá bớt ${n - 12} dòng.` : "Thêm ý cho đủ dòng."}`;
  }
  const long = lines.findIndex((l) => l.length > 200);
  return long >= 0 ? `Dòng ${long + 1} dài quá 200 ký tự.` : "";
}
function outlineCountMarkup() {
  const n = outlineLines(createState.tOutline).length, err = outlineProblem(createState.tOutline);
  return err && n > 0 ? `<div class="price-preview bad-text">${esc(err)}</div>`
    : `<div class="hint">${n} dòng = ${n} cảnh (tối thiểu 2, tối đa 12)</div>`;
}
