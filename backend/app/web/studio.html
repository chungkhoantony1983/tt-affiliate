function bindCreateEvents() {
  $("#back")?.addEventListener("click", async () => {
    if (!(await leaveOk())) return;
    current = null; mode = null; dirty = false; banner = null;
    history.replaceState(null, "", location.pathname);
    document.body.classList.remove("has-detail");
    $("#bar").hidden = true;
    $("#main").innerHTML = '<p class="empty">Chọn một video ở danh sách bên trái hoặc bấm <b>+ Tạo video mới</b>.</p>';
    loadList();
  });

  $("#main").querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => {
    syncCreateDomToState();
    if (createState.kind === b.dataset.kind) return;
    createState.kind = b.dataset.kind;
    try { localStorage.setItem("studio.kind", createState.kind); } catch { /* private mode: not remembered */ }
    renderCreate();
  }));
  const tName = $("#t-name"), tOutline = $("#t-outline");
  if (tName) {
    const suggest = () => {   // health-style topics: a safe default the operator can see and edit
      const notes = $("#t-notes");
      if (/tập/i.test(tName.value + " " + tOutline.value) && !notes.value.trim()) {
        notes.value = NOTES_SUGGEST; createState.tNotesAuto = true;
        $("#t-notes-hint").textContent = "Đề xuất sẵn, sửa được.";
      }
    };
    tName.addEventListener("input", suggest);
    tOutline.addEventListener("input", () => {
      suggest();
      createState.tOutline = tOutline.value;
      $("#t-outline-msg").innerHTML = outlineCountMarkup();
    });
    $("#t-notes").addEventListener("input", () => { $("#t-notes-hint").textContent = "Máy sẽ làm đúng lưu ý này khi viết lời đọc."; });
  }

  $("#tab-url")?.addEventListener("click", () => {
    syncCreateDomToState();
    createState.source = "url";
    renderCreate();
  });
  $("#tab-sheet")?.addEventListener("click", () => {
    syncCreateDomToState();
    createState.source = "sheet";
    renderCreate();
  });

  $("#c-sheet-select")?.addEventListener("change", (e) => {
    createState.sheetRow = e.target.value;
    if ($("#c-sheet-row")) $("#c-sheet-row").value = e.target.value;
    updateCreateRowMsg();
    updateCreateBar();
  });
  $("#c-sheet-row")?.addEventListener("input", (e) => {
    createState.sheetRow = e.target.value;
    if ($("#c-sheet-select")) $("#c-sheet-select").value = e.target.value;
    updateCreateRowMsg();
    updateCreateBar();
  });

  $("#c-price")?.addEventListener("input", (e) => {
    createState.priceRaw = e.target.value;
    const prev = $("#c-price-preview");
    if (prev) prev.innerHTML = pricePreviewMarkup(createState.priceRaw, { allowEmpty: true });
    updateCreateBar();
  });

  $("#b-preview")?.addEventListener("click", () => fetchProductPreview());

  $("#main").querySelectorAll("input, textarea").forEach((el) => {
    el.addEventListener("input", () => {
      syncCreateDomToState();
      updateCreateBar();
    });
  });

  bindCreateSlotEvents();
}

function updateCreateRowMsg() {
  const msgEl = $("#c-row-msg");
  const err = sheetRowValidationMessage();
  if (msgEl) {
    msgEl.innerHTML = err
      ? `<div class="price-preview bad-text">${esc(err)}</div>`
      : '<div class="hint">Dòng 1 là dòng tiêu đề cột. Các sản phẩm bắt đầu từ dòng 2 trở đi.</div>';
  }
  const btn = $("#b-preview");
  if (btn) btn.disabled = jobBusy() || createState.loadingPreview || !!err;
}

function bindCreateSlotEvents() {
  const root = $("#c-slots");
  if (!root) return;
  root.querySelectorAll("[data-c-upload]").forEach((b) =>
    b.addEventListener("click", () => pickStagingImage(+b.dataset.cUpload))
  );
  root.querySelectorAll("[data-c-del]").forEach((b) =>
    b.addEventListener("click", () => removeStagingImage(+b.dataset.cDel))
  );
  root.querySelectorAll("[data-c-add]").forEach((b) =>
    b.addEventListener("click", () => {
      if (createState.slots.length < MAX_PRODUCT_IMAGES) createState.slots.push(null);
      root.innerHTML = createSlotsMarkup();
      bindCreateSlotEvents();
    })
  );
}

async function fetchProductPreview() {
  syncCreateDomToState();
  const rowErr = sheetRowValidationMessage();
  if (rowErr) { showBanner("bad", rowErr); return; }
  if (createState.source === "url" && !createState.productUrl.trim()) {
    showBanner("bad", "Hãy dán link sản phẩm TikTok Shop trước khi bấm Lấy thông tin sản phẩm.");
    $("#c-url")?.focus();
    return;
  }
  if (createState.source === "sheet" && !String(createState.sheetRow || "").trim()) {
    showBanner("bad", "Hãy chọn một dòng hoặc nhập số dòng trên Google Sheet (bắt đầu từ dòng 2).");
    $("#c-sheet-row")?.focus();
    return;
  }
  createState.loadingPreview = true;
  renderCreate();
  try {
    const payload = createState.source === "sheet"
      ? { source: "sheet", sheet_row: parseInt(createState.sheetRow, 10) }
      : { source: "url", product_url: createState.productUrl.trim() };
    const res = await api("/product-preview", { method: "POST", json: payload });
    if (res.name) createState.name = res.name;
    if (!res.blocked) {
      createState.priceRaw = res.price ? formatVndDots(res.price) : (createState.priceRaw || "");
    }
    const imgs = res.images || [];
    createState.slots = Array.from({ length: Math.max(3, Math.min(imgs.length, MAX_PRODUCT_IMAGES)) }, (_, k) =>
      imgs[k] ? { url: imgs[k], source: imgs[k], uploaded: false } : null
    );
    if (res.selling_points) createState.sellingPoints = res.selling_points;
    if (res.category) createState.category = res.category;
    if (res.notes !== undefined && res.notes !== null && res.notes !== "") createState.notes = res.notes;

    if (res.warning) {
      banner = { kind: "warn", html: esc(res.warning) };
    } else {
      banner = { kind: "ok", html: "Đã lấy thông tin sản phẩm. Hãy kiểm tra lại Giá và Ảnh sản phẩm ở Bước 2 trước khi bấm Tạo video." };
    }
    createState.loadingPreview = false;
    renderCreate();
    if (res.blocked || !createState.name.trim()) {
      $("#c-name")?.focus();
    }
  } catch (e) {
    createState.loadingPreview = false;
    showBanner("bad", e.message);
    renderCreate();
  }
}

function pickStagingImage(slot) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/png,image/jpeg,image/webp";
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { showBanner("bad", "Ảnh quá lớn (tối đa 15 MB)."); return; }
    syncCreateDomToState();
    try {
      const res = await api(`/staging-image?slot=${slot}`, {
        method: "POST",
        body: file,
        headers: { "Content-Type": "application/octet-stream" },
      });
      createState.slots[slot] = { url: res.url, source: res.name, uploaded: true };
      const slotsEl = $("#c-slots");
      if (slotsEl) { slotsEl.innerHTML = createSlotsMarkup(); bindCreateSlotEvents(); }
      updateCreateBar();
    } catch (e) { showBanner("bad", e.message); }
  };
  input.click();
}

async function removeStagingImage(slot) {
  syncCreateDomToState();
  try {
    await api(`/staging-image?slot=${slot}`, { method: "DELETE" });
    createState.slots[slot] = null;
    const slotsEl = $("#c-slots");
    if (slotsEl) { slotsEl.innerHTML = createSlotsMarkup(); bindCreateSlotEvents(); }
    updateCreateBar();
  } catch (e) { showBanner("bad", e.message); }
}

function updateTopicBar() {
  const bar = $("#bar"), c = createState;
  const busy = jobBusy();
  const outErr = outlineProblem(c.tOutline), nameOk = c.tName.trim().length >= 1;
  const can = !busy && !outErr && nameOk;
  const why = busy ? "Đang xử lý, đợi một chút…" : !nameOk ? "Nhập tên chủ đề." : outErr ? outErr : NEXT_STEP_NOTE;
  bar.hidden = false;
  bar.innerHTML = `<span class="why">${esc(why)}</span><button class="btn primary" id="b-create" ${can ? "" : "disabled"}>Viết kịch bản</button>`;
  $("#b-create").onclick = () => startCreate();
}

function updateCreateBar() {
  if (mode !== "create") return;
  if (createState.kind === "topic") { updateTopicBar(); return; }
  const bar = $("#bar");
  const busy = jobBusy() || createState.loadingPreview;
  const p = parsePriceRaw(createState.priceRaw);
  const rowErr = sheetRowValidationMessage();
  const hasSource = createState.source === "sheet"
    ? (String(createState.sheetRow || "").trim() !== "" && !rowErr)
    : (createState.productUrl.trim() !== "" || createState.name.trim() !== "");
  const canCreate = !busy && !p.invalid && !rowErr && hasSource;

  let why;
  if (busy) why = "Đang xử lý, đợi một chút…";
  else if (rowErr) why = rowErr;
  else if (p.invalid) why = "Giá sản phẩm chưa hợp lệ (nhập từ 1.000đ trở lên, hoặc nhập 0 để ẩn giá).";
  else if (!hasSource) why = "Chọn nguồn sản phẩm ở Bước 1, kiểm tra Giá & Ảnh ở Bước 2 rồi bấm Viết kịch bản.";
  else why = NEXT_STEP_NOTE;

  bar.hidden = false;
  bar.innerHTML = `<span class="why">${esc(why)}</span>
    <button class="btn primary" id="b-create" ${canCreate ? "" : "disabled"}>Viết kịch bản</button>`;
  $("#b-create").onclick = () => startCreate();
}

async function startCreateTopic() {
  const c = createState;
  const err = outlineProblem(c.tOutline);
  if (err) { showBanner("bad", err); $("#t-outline")?.focus(); return; }
  try {
    await api("/create", { method: "POST", json: {
      kind: "topic", name: c.tName.trim(), audience: c.tAudience.trim() || null, outline: c.tOutline,
      notes: c.tNotes.trim() || null, images: c.slots.filter(Boolean).map((x) => x.source),
      voice: c.tVoice, voice_gender: c.tGender } });
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

async function startCreate() {
  syncCreateDomToState();
  if (createState.kind === "topic") { await startCreateTopic(); return; }
  const p = parsePriceRaw(createState.priceRaw);
  if (p.invalid) {
    showBanner("bad", "Giá đang dưới 1.000đ. Kiểm tra lại xem bạn có gõ thiếu 3 số 0 (ví dụ 189.000) không, hoặc nhập 0 nếu muốn ẩn giá.");
    return;
  }
  const rowErr = sheetRowValidationMessage();
  if (rowErr) { showBanner("bad", rowErr); return; }

  const activeImages = createState.slots.filter(Boolean).map((s) => s.source);
  const payload = {
    sheet_row: createState.source === "sheet" && String(createState.sheetRow || "").trim()
      ? parseInt(createState.sheetRow, 10)
      : null,
    product_url: createState.source === "url" ? (createState.productUrl.trim() || null) : null,
    name: createState.name.trim() || null,
    price: p.empty ? null : p.value,
    images: activeImages.length ? activeImages : null,
    style: createState.style || "simple",
    category: createState.category.trim() || "Nhà cửa",
    selling_points: createState.sellingPoints.trim() || null,
    notes: createState.notes.trim() || null,
    voice: createState.voice || null,
  };
  try {
    await api("/create", { method: "POST", json: payload });
    watchJob();
  } catch (e) {
    showBanner("bad", e.message);
    if (/Tên sản phẩm/i.test(e.message)) $("#c-name")?.focus();
  }
}

// ---------------- detail ----------------
function stepsMarkup(n) {
  const li = (k, t) => `<li class="${n === k ? "on" : ""}"${n === k ? ' aria-current="step"' : ""}>${k} ${t}</li>`;
  return `<ol class="steps">${li(1, "Soạn bố cục")}${li(2, "Dựng và xem thử")}${li(3, "Duyệt &amp; lưu")}</ol>`;
}

function render() {
  const v = current, main = $("#main");
  main.classList.remove("busy");
  if (v.stage === "script_review") { renderLayout(); return; }
  const head = `
    <button class="btn small back" id="back">← Danh sách</button>
    <div class="title-row"><h2>${esc(v.title)}</h2><span class="badge b-${v.label}">${LABELS[v.label]}</span></div>
    ${v.label !== "view_only" && v.kind !== "travel" ? stepsMarkup(v.label === "approved" ? 3 : 2) : ""}
    <div id="banner">${banner ? bannerMarkup() : ""}</div>${v.kind === "travel" ? travelStaleBanner(v) : ""}
    <div id="voiceline"></div>`;
  const player = `<div class="player"><video id="vid" controls playsinline preload="metadata" src="${esc(v.video_url)}#t=0.1"></video></div>`;

  if (v.label === "view_only") {
    main.innerHTML = head + `<div class="detail">${player}<div>
      <div class="card"><h3>Chữ đăng kèm video</h3>
        <p class="sub">Video này làm bằng công cụ khác nên chỉ xem được, không sửa được ở đây.</p>
        <textarea readonly rows="4">${esc(v.post_text)}</textarea>
        <div class="copy-row"><button class="btn small" data-copy="post">Chép chữ đăng kèm</button></div>
      </div></div></div>`;
    $("#bar").hidden = true;
    bindCommon();
    return;
  }

  const initialPriceStr = v.price ? formatVndDots(v.price) : "0";
  main.innerHTML = head + `<div class="detail">${player}<div>
    <div id="voicenote"></div>
    <div class="card">
      <h3>Chữ đăng kèm video</h3>
      <p class="sub">Dán vào TikTok khi đăng. Sửa phần này không cần dựng lại video.</p>
      <label class="f" for="caption">Lời giới thiệu</label>
      <textarea id="caption" rows="3">${esc(v.caption)}</textarea>
      <label class="f" for="hashtags">Hashtag</label>
      <input type="text" id="hashtags" value="${esc(v.hashtags)}">
      <div class="hint">Cách nhau bằng dấu cách, ví dụ: #botmeden #tiktokshop</div>
      <div class="copy-row"><button class="btn small" data-copy="post">Chép chữ đăng kèm</button></div>
    </div>
    <div class="card">
      <h3>Chữ trên video</h3>
      <p class="sub">Sửa phần này xong cần bấm <b>Dựng lại video</b>.</p>
      ${v.kind === "travel" ? "" : `<label class="f" for="hook">Câu mở đầu (chữ lớn ở cảnh 1)</label>
      <input type="text" id="hook" value="${esc(v.hook)}">`}
      ${v.kind === "travel" || v.kind === "topic" ? "" : `<label class="f" for="price">Giá hiện trên video (đồng)</label>
      <input type="text" id="price" inputmode="numeric" value="${esc(initialPriceStr)}">
      <div id="price-preview">${pricePreviewMarkup(initialPriceStr, { allowEmpty: false, oldPrice: v.price })}</div>`}
    </div>
    <div class="card">
      <h3>Từng cảnh</h3>
      <p class="sub">Lời đọc là câu giọng nói sẽ đọc. Câu nào sửa thì chỉ câu đó được đọc lại.</p>
      ${v.segments.map(sceneMarkup).join("")}
    </div>
    ${v.kind === "travel" ? travelCards(v) : `<div class="card">
      <h3>${v.kind === "topic" ? "Ảnh minh hoạ" : "Ảnh sản phẩm"}</h3>
      <p class="sub">${v.kind === "topic" ? "Video dùng tối đa 10 ảnh, xoay vòng ở các cảnh." : "Video dùng tối đa 10 ảnh. Ảnh đầu tiên dùng cho cảnh mở đầu và cảnh kêu gọi mua."}</p>
      <div class="pimgs">${productImagesMarkup()}</div>
    </div>`}
  </div></div>`;
  bindCommon();
  main.querySelectorAll("input, textarea").forEach((el) => el.addEventListener("input", () => {
    dirty = true;
    if (el.id === "price" && $("#price-preview")) {
      $("#price-preview").innerHTML = pricePreviewMarkup($("#price").value, { allowEmpty: false, oldPrice: v.price });
    }
    updateBar();
  }));
  updateBar();
}

function sceneMarkup(s) {
  if (current.kind === "travel") return travelSceneMarkup(s);
  const first = s.index === 0;
  const tag = first ? "Mở đầu" : KINDS[s.kind] || "Cảnh";
  const showText = (s.kind === "product" || s.kind === "topic" || s.kind === "outro") && !first;
  let img = "";
  if (s.kind === "story") {
    const thumb = s.image_url ? `<img class="thumb" src="${esc(s.image_url)}" alt="Ảnh cảnh ${s.index + 1}">`
                              : `<div class="thumb">Chưa có ảnh</div>`;
    img = `<div class="scene-img">${thumb}<div><div class="acts">
      <button class="btn small" data-upload="scene" data-index="${s.index}">${s.image_url ? "Đổi ảnh" : "Tải ảnh lên"}</button>
      ${s.image_prompt ? `<button class="btn small" data-prompt="${s.index}">Chép gợi ý tạo ảnh</button>` : ""}</div>
      <div class="hint">Ảnh dọc, người Việt, không có chữ trong ảnh.</div></div></div>`;
  }
  return `<div class="scene" data-scene="${s.index}">
    <div class="scene-head"><b>Cảnh ${s.index + 1}</b><span class="chip">${esc(tag)}</span>
      <span class="chip">${esc(SPEAKERS[s.speaker] || s.speaker)}</span>
      <span class="chip re" data-re hidden>Sẽ đọc lại</span></div>
    <label class="f" for="line-${s.index}">Lời đọc</label>
    <textarea id="line-${s.index}" rows="2" data-line="${s.index}">${esc(s.line)}</textarea>
    ${showText ? `<label class="f" for="text-${s.index}">Chữ trên màn hình (ngắn, tối đa 4 từ)</label>
      <input type="text" id="text-${s.index}" data-text="${s.index}" value="${esc(s.text)}">` : ""}
    ${img}</div>`;
}

function productImagesMarkup() {
  const imgs = current.product_images;
  const slots = imgs.map((p) => `<div class="pimg">
      ${p.url ? `<img class="thumb" src="${esc(p.url)}" alt="Ảnh sản phẩm ${p.slot + 1}">` : `<div class="thumb">Ảnh trên máy</div>`}
      <button class="btn small" data-upload="product" data-index="${p.slot}">Thay ảnh ${p.slot + 1}</button></div>`);
  if (imgs.length < MAX_PRODUCT_IMAGES) slots.push(`<div class="pimg"><div class="thumb">Trống</div>
      <button class="btn small" data-upload="product" data-index="${imgs.length}">Thêm ảnh</button></div>`);
  return slots.join("");
}

function bindCommon() {
  paintVoice();
  $("#back")?.addEventListener("click", async () => {
    if (!(await leaveOk())) return;
    current = null; mode = null; dirty = false; banner = null;
    history.replaceState(null, "", location.pathname);
    document.body.classList.remove("has-detail");
    $("#bar").hidden = true;
    $("#main").innerHTML = '<p class="empty">Chọn một video ở danh sách bên trái hoặc bấm <b>+ Tạo video mới</b>.</p>';
    loadList();
  });
  $("#main").querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => {
    const text = current.label === "view_only" ? current.post_text
      : `${$("#caption").value.trim()} ${$("#hashtags").value.trim()}`.trim();
    copy(text, b);
  }));
  $("#main").querySelectorAll("[data-prompt]").forEach((b) => b.addEventListener("click", () => {
    copy(current.segments[+b.dataset.prompt].image_prompt, b);
  }));
  $("#main").querySelectorAll("[data-upload]").forEach((b) =>
    b.addEventListener("click", () => pickImage(b.dataset.upload, +b.dataset.index)));
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
  const old = btn.textContent; btn.textContent = "Đã chép ✓"; setTimeout(() => (btn.textContent = old), 1500);
}

function formValues() {
  const p = $("#price") ? parsePriceRaw($("#price").value) : { empty: false, value: null, invalid: false };
  return {
    caption: $("#caption").value,
    hashtags: $("#hashtags").value,
    hook: $("#hook") ? $("#hook").value : current.hook,
    price: $("#price") ? (p.empty ? 0 : p.value) : current.price,
    priceInvalid: p.invalid,
    segments: current.segments.map((s) => ({
      line: $(`[data-line="${s.index}"]`).value,
      text: $(`[data-text="${s.index}"]`)?.value ?? s.text,
      ...(current.kind === "travel" ? { subs: travelSubsOf(s) } : {}),
    })),
  };
}

function changedLines() {
  return current.segments.filter((s) => norm($(`[data-line="${s.index}"]`).value) !== norm(s.audio_line)).map((s) => s.index);
}

function formNeedsRender() {
  const f = formValues(), v = current;
  if (norm(f.hook) !== norm(v.hook) || f.price !== v.price) return true;
  return v.segments.some((s, i) => norm(f.segments[i].line) !== norm(s.line) || f.segments[i].text.trim() !== (s.text || "")
    || (v.kind === "travel" && travelSubsChanged(s, f.segments[i].subs)));
}

function jobBusy() { return !!polling; }

function updateBar() {
  const v = current, bar = $("#bar");
  if (mode === "create") { updateCreateBar(); return; }
  if (!v || v.label === "view_only") { bar.hidden = true; return; }
  if (v.stage === "script_review") { updateLayoutBar(); return; }
  const changed = changedLines();
  document.querySelectorAll("[data-scene]").forEach((el) => {
    el.querySelector("[data-re]").hidden = !changed.includes(+el.dataset.scene);
  });
  // Cost of re-voicing, shown before the button is pressed. Edited lines are re-voiced with the
  // video's own Gemini voice only, so the count is that voice's, not the whole chain's.
  let note = "";
  if (changed.length) {
    const k = changed.length;
    const guess = v.voice_engine_known ? "" : " (Video này làm trước khi có Studio, máy đoán theo cài đặt hiện tại.)";
    const row = quota.available ? modelRow(v.voice_model) : null;
    if (v.voice_engine !== "gemini") {
      note = `<div class="banner info">Bạn sửa ${k} lời đọc. Video dùng giọng miễn phí, không giới hạn lượt.${guess}</div>`;
    } else if (!row) {
      note = `<div class="banner info">Bạn sửa ${k} lời đọc. Dựng lại sẽ dùng <b>${k} lượt</b> giọng Gemini của video này.${guess}</div>`;
    } else if (row.left >= k) {
      const after = row.left - k, per = quota.calls_per_video || 4;
      const videosAfter = row.role === "other" ? quota.videos_left
        : quota.videos_left - Math.floor(row.left / per) + Math.floor(after / per);
      const tail = videosAfter < 1 ? ` Sau đó không đủ lượt Gemini cho một video mới trước ${esc(about(quota.resets_at))}.` : "";
      note = `<div class="banner info">Bạn sửa ${k} lời đọc. Dựng lại sẽ dùng <b>${k} lượt</b> giọng Gemini của video này. Hiện còn ${row.left}, sau khi dựng còn ${after}.${tail}${guess}</div>`;
    } else {
      note = `<div class="banner bad">Bạn sửa ${k} lời đọc nhưng giọng Gemini của video này chỉ còn ${row.left} lượt. Chọn một cách: sửa ít câu hơn; đợi đến ${esc(about(backAt(row)))}; hoặc đọc lại toàn bộ bằng giọng miễn phí.${guess}
        <div class="acts"><button class="btn small" data-act="revoice" ${jobBusy() ? "disabled" : ""}>Đọc lại toàn bộ bằng giọng miễn phí</button></div></div>`;
    }
  }
  if (v.kind === "travel") note += travelEditNote();
  if ($("#voicenote").innerHTML !== note) $("#voicenote").innerHTML = note;

  const busy = jobBusy();
  const priceInvalid = parsePriceRaw($("#price")?.value).invalid;
  const needsRender = v.needs_render || (dirty && formNeedsRender());
  let why;
  if (busy) why = "Đang chạy, đợi một chút…";
  else if (priceInvalid) why = "Giá đang dưới 1.000đ. Kiểm tra lại số 0 hoặc nhập 0 nếu muốn ẩn giá.";
  else if (dirty && needsRender) why = "Có thay đổi chưa lưu. Bấm Dựng lại video để lưu và xem kết quả.";
  else if (dirty) why = "Có thay đổi chưa lưu.";
  else if (v.needs_render) why = "Video chưa cập nhật theo chỗ bạn vừa sửa. Bấm Dựng lại video.";
  else if (v.label === "needs_images") why = "Còn cảnh chưa có ảnh nhân vật. Tải ảnh lên rồi dựng lại.";
  else if (v.label === "approved") why = "Video này đã duyệt trước đó.";
  else why = "Xem hết video. Đạt thì bấm Duyệt & lưu.";
  const stale = v.kind === "travel" && (v.stale_ids || []).length > 0;
  if (stale && !busy && !dirty && !v.needs_render) why = "Cần làm mới nguồn trước khi duyệt (xem khung vàng ở đầu trang).";
  const canApprove = !busy && !dirty && !priceInvalid && !v.needs_render && v.label !== "needs_images" && !stale;
  bar.hidden = false;
  bar.innerHTML = `<span class="why">${esc(why)}</span>
    <button class="btn" id="b-save" ${!dirty || busy || priceInvalid ? "disabled" : ""}>Lưu thay đổi</button>
    <button class="btn ${needsRender && !busy && !priceInvalid ? "primary" : ""}" id="b-render" ${busy || priceInvalid ? "disabled" : ""}>Dựng lại video</button>
    ${v.kind === "travel" ? "" : v.label === "approved" ? '<span class="hint">Video đã duyệt, không sửa bố cục được</span>'
      : `<button class="btn" id="b-layout" ${busy ? "disabled" : ""}>Sửa bố cục</button>`}
    ${v.kind === "product" ? `<button class="btn" id="b-capcut" ${busy || dirty || v.needs_render ? "disabled" : ""} title="${v.capcut ? "Đã xuất: " + esc(v.capcut.draft_name || "") : "Tạo dự án CapCut từ video này để chỉnh tiếp"}">${v.capcut ? "Xuất lại sang CapCut" : "Xuất sang CapCut"}</button>` : ""}
    <button class="btn ${canApprove ? "primary" : ""}" id="b-approve" ${canApprove ? "" : "disabled"}>${stale ? "Cần làm mới nguồn trước" : "Duyệt &amp; lưu"}</button>`;
  $("#b-save").onclick = () => save().then(() => { showBanner("ok", "Đã lưu."); render(); }).catch((e) => showBanner("bad", e.message));
  $("#b-render").onclick = () => startRender();
  $("#b-approve").onclick = () => askApprove();
  if ($("#b-capcut")) $("#b-capcut").onclick = () => startCapcut();
  if ($("#b-layout")) $("#b-layout").onclick = () => askOpenLayout();
}

async function startCapcut() {
  try {
    await api(`/videos/${encodeURIComponent(current.folder)}/capcut`, { method: "POST" });
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

async function save() {
  if (!dirty) return;
  const vals = formValues();
  if (vals.priceInvalid) {
    throw new Error("Giá đang dưới 1.000đ. Kiểm tra lại xem bạn có gõ thiếu 3 số 0 (ví dụ 189.000) không, hoặc nhập 0 nếu muốn ẩn giá.");
  }
  delete vals.priceInvalid;
  current = await api("/videos/" + encodeURIComponent(current.folder), { method: "PUT", json: vals });
  dirty = false;
  say("Đã lưu");
}

function pickImage(target, index) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/png,image/jpeg,image/webp";
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { showBanner("bad", "Ảnh quá lớn (tối đa 15 MB)."); return; }
    try {
      await save();
      current = await api(`/videos/${encodeURIComponent(current.folder)}/image?target=${target}&index=${index}`,
        { method: "POST", body: file, headers: { "Content-Type": "application/octet-stream" } });
      banner = { kind: "warn", html: "Đã nhận ảnh. Bấm <b>Dựng lại video</b> để đưa ảnh vào video." };
      render();
    } catch (e) { showBanner("bad", e.message); }
  };
  input.click();
}

// ---------------- jobs ----------------
async function startRender(revoiceAll) {
  try {
    await save();
    // revoiceAll: "edge" (free voice) | "gemini" | undefined (only the edited lines)
    await api(`/videos/${encodeURIComponent(current.folder)}/render`, { method: "POST", json: revoiceAll ? { revoice_all: revoiceAll } : {} });
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

async function askApprove() {
  // A video that is not on the main Gemini voice is pointed out before it is approved:
  // after approval the folder may be gone and the voice cannot be changed any more.
  const extra = current.voice_role === "free" ? "Video này dùng giọng miễn phí. Sau khi duyệt không đổi giọng được nữa."
    : current.voice_role === "backup" ? "Video này dùng giọng Gemini phụ. Bạn đã nghe kỹ chưa?" : "";
  const ok = await ask({
    title: "Duyệt video này?",
    text: drive
      ? "Máy sẽ lưu chữ đăng kèm, tải cả thư mục video lên Google Drive, rồi xoá bản trên máy. Sau đó video không còn trong danh sách này."
      : "Máy sẽ lưu chữ đăng kèm và danh sách việc cần làm khi đăng vào thư mục video, rồi đánh dấu Đã duyệt. Video vẫn giữ trên máy.",
    extra, yes: "Duyệt & lưu" });
  if (!ok) return;
  try {
    await api(`/videos/${encodeURIComponent(current.folder)}/approve`, { method: "POST" });
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

function stepText(job) {
  const log = job.log.join("\n");
  if (job.action === "approve") return /Drive|Upload/i.test(log) ? "Đang tải lên Google Drive…" : "";
  if (/Rendering video|Scene \d/.test(log)) return "Đang dựng hình…";
  if (/voic/i.test(log)) return "Đang tạo giọng đọc…";
  if (/Generating .* script|Writing .* script/i.test(log)) return "Đang viết kịch bản…";
  return "Đang chuẩn bị…";
}

function watchJob() {
  clearInterval(polling);
  const tick = async () => {
    let job;
    try { job = await api("/job"); } catch { return; }
    if (job.state === "running") {
      let what;
      if (job.action === "approve") what = "Đang duyệt.";
      else if (job.action === "capcut") what = "Đang tạo dự án CapCut, chỉ mất vài giây.";
      else if (job.action === "create") what = "Đang viết kịch bản. Bạn có thể đóng trang này, video sẽ hiện trong danh sách khi xong.";
      else if (job.action === "rewrite") what = "Đang viết lại (thường vài giây).";
      else if (job.action === "continue") what = "Đang dựng video theo bố cục: đọc giọng rồi dựng hình.";
      else what = "Đang dựng lại video, thường mất 1–2 phút.";
      banner = { kind: "job", html: `<span class="spinner"></span>${what} ${esc(stepText(job))}` };
      paintBanner();
      return;
    }
    clearInterval(polling); polling = null;
    if (job.state === "idle") { banner = null; paintBanner(); return; }
    await jobFinished(job);
  };
  polling = setInterval(tick, 2000);
  tick();
}

async function jobFinished(job) {
  const log = `<details><summary>Xem chi tiết kỹ thuật</summary><pre>${esc(job.log.join("\n"))}</pre></details>`;
  const driveLink = job.drive_link ? ` <a href="${esc(job.drive_link)}" target="_blank" rel="noopener">Mở thư mục Drive</a>` : "";
  await loadQuota();  // the job may have used Gemini requests, or learned that a voice ran out
  if (job.action === "continue" || job.action === "rewrite") { await layoutJobFinished(job, log); return; }
  if (job.state === "done" && job.action === "create") {
    banner = { kind: "ok", html: "Đã viết xong kịch bản. Xem và sửa bố cục, rồi bấm Dựng video theo bố cục này." };
    await loadList();
    if (job.folder && videos.some((v) => v.folder === job.folder)) {
      await openVideo(job.folder, true);
    } else if (videos.length) {
      await openVideo(videos[0].folder, true);
    }
    say("Đã tạo xong video mới");
  } else if (job.action === "capcut") {
    const logText = job.log.join("\n");
    if (job.state === "done") {
      const m = logText.match(/"draft_name":\s*"([^"]+)"/);
      banner = { kind: "ok", html: `Đã tạo dự án CapCut <b>${esc(m ? m[1] : "")}</b>. Thoát hẳn CapCut (Cmd+Q) rồi mở lại để thấy dự án.` };
      say("Đã xuất sang CapCut");
    } else if (/capcut-mcp/.test(logText)) {
      banner = { kind: "bad", html: "Máy chưa cài công cụ CapCut. Mở Terminal trong thư mục dự án và chạy: <code>.venv/bin/pip install -e tools/capcut-mcp</code>" + log };
    } else {
      banner = { kind: "bad", html: "Chưa xuất sang CapCut được. Video trên Studio vẫn nguyên, bạn vẫn dùng được video.mp4." + log };
    }
    await openVideo(job.folder, true);
  } else if (job.state === "done" && job.action === "render") {
    banner = { kind: "ok", html: "Đã dựng xong. Xem lại video." };
    await openVideo(job.folder, true);
    say("Đã dựng xong video");
  } else if (job.state === "done" && job.action === "approve") {
    if (job.folder_kept) {
      banner = { kind: "ok", html: "Đã duyệt. Chữ đăng kèm đã lưu cạnh video." + driveLink };
      await openVideo(job.folder, true);
    } else {
      current = null; mode = null; dirty = false; banner = null;
      document.body.classList.remove("has-detail");
      $("#bar").hidden = true;
      $("#main").innerHTML = `<div class="banner ok">Đã duyệt và chuyển video lên Google Drive.${driveLink}</div>`;
      document.body.classList.add("has-detail");
      await loadList();
    }
    say("Đã duyệt video");
  } else if (job.action === "create") {
    banner = {
      kind: "bad",
      html: "Chưa viết được kịch bản. Bạn hãy kiểm tra lại thông tin ở dưới rồi bấm Viết kịch bản để thử lại." + log,
    };
    if (mode !== "create") {
      await openCreate(true);
    } else {
      paintBanner();
      updateCreateBar();
    }
  } else if (job.error_kind === "revoice" && current && current.kind === "travel") {
    banner = { kind: "bad", html: "Không đọc lại được câu đã sửa bằng giọng miễn phí, thường do mạng chập chờn hoặc dịch vụ giọng đang bận. Video và giọng cũ vẫn giữ nguyên. Kiểm tra mạng rồi bấm Dựng lại video thử lần nữa." + log };
    await openVideo(job.folder, true);
  } else if (job.error_kind === "revoice") {
    const same = current && current.folder === job.folder;
    const logText = job.log.join("\n");
    const freeVideo = same && current.voice_engine !== "gemini";
    if (freeVideo && !/gemini TTS quota/.test(logText)) {
      // The free voice itself failed (network); there is no other voice to offer.
      banner = { kind: "bad", html: "Không đọc lại được câu đã sửa bằng giọng miễn phí. Video và giọng cũ vẫn giữ nguyên. Đợi ít phút rồi bấm Dựng lại video." + log };
    } else if (freeVideo) {
      // "Đọc lại toàn bộ bằng giọng Gemini" was asked for a free-voice video, and Gemini is short.
      const wait = esc(quota.available ? about(chainBackAt(current.voice_calls || 0)) : "khi có lại lượt");
      banner = { kind: "bad", html: `Giọng Gemini không đủ lượt nên máy chưa đọc lại câu nào. Video vẫn dùng giọng miễn phí như cũ. Đợi đến ${wait} rồi thử lại.` + log };
    } else {
      const wait = esc(about(backAt(quota.available && same ? modelRow(current.voice_model) : null)));
      // "no API call made": demo.py's own count said the voice was short, Gemini was not asked.
      const what = /no API call made/.test(logText)
        ? "Giọng Gemini không đủ lượt nên máy chưa đọc lại câu nào."
        : "Gemini báo đã hết lượt dù máy đếm còn.";
      banner = { kind: "bad", html: `${what} Video và giọng cũ vẫn giữ nguyên. Đợi đến ${wait} rồi dựng lại, hoặc đọc lại toàn bộ bằng giọng miễn phí.`
        + `<div class="acts"><button class="btn small" data-act="revoice">Đọc lại toàn bộ bằng giọng miễn phí</button></div>`
        + `<div class="hint">Cả video phải dùng chung một giọng, nên không đổi riêng được câu đã sửa.</div>` + log };
    }
    await openVideo(job.folder, true);
  } else if (job.error_kind === "drive_failed") {
    const n = (job.notices || []).filter((l) => l.startsWith("[DRIVE_FAILED] ")).map((l) => l.replace(/^\[DRIVE_FAILED\]\s*/, ""));
    banner = { kind: "bad", html: "Duyệt xong nhưng chưa tải lên Drive được. Video vẫn còn trên máy; kiểm mạng / đăng nhập Drive rồi bấm Duyệt lại."
      + (n.length ? `<pre>${esc(n.slice(-3).join("\n"))}</pre>` : "") + log };
    await openVideo(job.folder, true);
  } else if (job.error_kind === "fact_check" || job.error_kind === "facts_stale") {
    banner = { kind: "bad", html: travelErrorHtml(job) + log };
    await openVideo(job.folder, true);
  } else if (job.error_kind === "not_ready") {
    banner = { kind: "bad", html: "Chưa duyệt được: video cần dựng lại, hoặc còn cảnh thiếu ảnh nhân vật." + log };
    await openVideo(job.folder, true);
  } else {
    banner = { kind: "bad", html: (job.action === "approve" ? "Duyệt bị lỗi." : "Dựng lại video bị lỗi.")
      + " Thư mục video vẫn còn nguyên, có thể thử lại." + log };
    if (videos.some((v) => v.folder === job.folder)) await openVideo(job.folder, true); else paintBanner();
  }
}

// ---------------- layout step (DR-0014): edit the scene list before any voice or render ----------------
// L = the editable copy of the scenes. The server is the only place that hands out sids and files;
// every structural change is saved first (PUT) and the page then shows what the server answered.
let L = null;
const LAYOUT_MAX = 12, LAYOUT_MIN = 2;
const enc = (f) => encodeURIComponent(f);
const shorten = (t, n = 80) => (norm(t).length > n ? norm(t).slice(0, n) + "…" : norm(t));

function layoutFromDetail(v) {
  const old = L && L.folder === v.folder ? L : null;
  const aiLine = old ? old.aiLine : {}, human = old ? old.human : new Set(), prev = old ? old.prev : {};
  const scenes = v.segments.map((s) => ({
    sid: s.sid, kind: s.kind, brief: s.brief || "", line: s.line || "", text: s.text || "",
    image_slot: s.image_slot === undefined ? null : s.image_slot, locked: !!s.locked, locked_reason: s.locked_reason || "",
    has_audio: !!s.has_audio, audio_line: s.audio_line || "",
  }));
  const after = old && old.afterRewrite;   // the AI just rewrote: remember what it replaced (D-44)
  if (after) {
    if (after.sid) { prev[after.sid] = after.before; const n = scenes.find((s) => s.sid === after.sid); if (n) aiLine[after.sid] = n.line; }
    else { for (const k of Object.keys(prev)) delete prev[k]; for (const k of Object.keys(aiLine)) delete aiLine[k]; }
  }
  for (const s of scenes) if (!(s.sid in aiLine) && !human.has(s.sid)) aiLine[s.sid] = s.line;
  L = { folder: v.folder, scenes, aiLine, human, prev, open: old ? Math.min(old.open, scenes.length - 1) : 0,
        err: null, hook: v.hook || "", caption: v.caption || "", hashtags: v.hashtags || "", afterRewrite: null, pending: null };
}

const needsVoice = (s) => !s.has_audio || norm(s.line) !== norm(s.audio_line || s.line);
const isHandmade = (s) => norm(s.line) !== "" && (s.sid && s.sid in L.aiLine ? norm(s.line) !== norm(L.aiLine[s.sid]) : true);

function layoutProblems() {
  const out = [], n = L.scenes.length;
  if (n < LAYOUT_MIN || n > LAYOUT_MAX) out.push({ idx: -1, msg: `video cần từ ${LAYOUT_MIN} đến ${LAYOUT_MAX} cảnh, hiện có ${n}` });
  L.scenes.forEach((s, i) => {
    if (!norm(s.line)) out.push({ idx: i, msg: `cảnh ${i + 1} chưa có lời đọc` });
    else if (norm(s.line).length > 300) out.push({ idx: i, msg: `cảnh ${i + 1}: lời đọc dài quá 300 ký tự` });
    if ((s.text || "").trim().length > 60) out.push({ idx: i, msg: `cảnh ${i + 1}: chữ trên hình dài quá 60 ký tự` });
  });
  return out;
}

function syncLayoutFromDom() {
  if (!L || !$("#l-hook")) return;
  L.hook = $("#l-hook").value; L.caption = $("#l-caption").value; L.hashtags = $("#l-hashtags").value;
  const s = L.scenes[L.open], line = $("#l-line");
  if (!s || !line) return;
  s.line = line.value; s.text = $("#l-text").value; s.brief = $("#l-brief").value;
  const pick = document.querySelector('input[name="l-img"]:checked');
  if (pick) s.image_slot = pick.value === "" ? null : +pick.value;
}

function layoutPayload() {
  return { hook: L.hook, caption: L.caption, hashtags: L.hashtags,
    scenes: L.scenes.map((s) => ({ sid: s.sid, kind: s.kind, brief: s.brief, line: s.line, text: s.text, image_slot: s.image_slot })) };
}

// PUT the screen as it is. Returns true on success; on failure the error is kept in L.err for the scene it names.
async function layoutSave(readScreen = true) {
  if (readScreen) syncLayoutFromDom();   // not after a move/add: the open scene on screen is then another one
  const sent = L.scenes;
  try {
    const res = await api(`/videos/${enc(current.folder)}/layout`, { method: "PUT", json: layoutPayload() });
    sent.forEach((s, i) => { if (!s.sid && res.segments[i]) L.human.add(res.segments[i].sid); });   // typed by hand, not by the AI
    L.prev = {};   // "Dùng lại câu cũ" lasts until the next save
    current = res; dirty = false;
    layoutFromDetail(res);
    return true;
  } catch (e) {
    const m = /Cảnh (\d+)/.exec(e.message);
    L.err = { idx: m ? +m[1] - 1 : L.open, msg: e.message };
    if (m && +m[1] - 1 < L.scenes.length) L.open = +m[1] - 1;
    return false;
  }
}

async function layoutOp(mutate) {
  if (jobBusy()) return;
  syncLayoutFromDom();
  const snap = JSON.parse(JSON.stringify(L.scenes)), snapOpen = L.open;
  mutate();
  if (await layoutSave(false)) { banner = null; renderLayout(); say("Đã lưu bố cục"); return; }
  const err = L.err;
  L.scenes = snap; L.open = snapOpen;   // not saved: back to what was on screen
  showBanner("bad", err.msg);
  renderLayout();
}

const newScene = () => ({ sid: null, kind: current.kind === "topic" ? "topic" : "product", brief: "", line: "", text: "",
  image_slot: null, locked: false, locked_reason: "", has_audio: false, audio_line: "" });

function layoutAdd(pos) { layoutOp(() => { L.scenes.splice(pos, 0, newScene()); L.open = pos; dirty = true; }); }
function layoutMove(i, d) {
  layoutOp(() => { const j = i + d, t = L.scenes[i]; L.scenes[i] = L.scenes[j]; L.scenes[j] = t; L.open = j; dirty = true; });
}
async function layoutDelete(i) {
  syncLayoutFromDom();
  if (!(await ask({ title: `Xoá cảnh ${i + 1}?`, text: `Xoá cảnh ${i + 1}? Cảnh sẽ mất khỏi bố cục khi bạn bấm Lưu bố cục hoặc Dựng.` + (current.can_cancel_layout
      ? " Muốn quay lại video cũ, bấm 'Bỏ các chỗ vừa sửa' trước khi dựng (nút đó bỏ cả bố cục vừa sửa, không chỉ cảnh này)." : ""), yes: "Xoá cảnh" }))) return;
  layoutOp(() => { L.scenes.splice(i, 1); L.open = Math.min(i, L.scenes.length - 1); dirty = true; });
}

async function startLayoutJob(path, json, pending) {
  try {
    await api(path, { method: "POST", json });
    L.pending = pending || null;
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

async function layoutSaveOrShow() {
  if (await layoutSave()) return true;
  showBanner("bad", L.err.msg); renderLayout();
  return false;
}

async function layoutRewrite(i) {
  if (jobBusy()) return;
  syncLayoutFromDom();
  const s = L.scenes[i];
  if (isHandmade(s) && !(await ask({ title: "Viết lại cảnh này?", yes: "Viết lại",
    text: "Cảnh này bạn đã sửa tay. AI viết lại sẽ thay lời bạn gõ. Tiếp tục?" }))) return;
  const before = { line: s.line, text: s.text }, instr = ($("#l-instr")?.value || "").trim();
  if (!(await layoutSaveOrShow())) return;
  const sid = L.scenes[i].sid;
  banner = { kind: "job", html: `<span class="spinner"></span>Đang viết lại cảnh ${i + 1}… (thường vài giây)` };
  renderLayout();
  await startLayoutJob(`/videos/${enc(current.folder)}/rewrite`, { scenes: [sid], instruction: instr }, { sid, before });
}

async function layoutRewriteAll() {
  if (jobBusy()) return;
  syncLayoutFromDom();
  if (!(await ask({ title: "Viết lại cả kịch bản?", yes: "Viết lại tất cả",
    text: "Lời đọc, chữ trên hình, câu mở đầu, caption và hashtag của mọi cảnh sẽ được viết lại. Cảnh và thứ tự giữ nguyên. Không hoàn tác." }))) return;
  const instr = ($("#l-instr-all")?.value || "").trim();
  if (!(await layoutSaveOrShow())) return;
  await startLayoutJob(`/videos/${enc(current.folder)}/rewrite`, { scenes: "all", instruction: instr }, { sid: null, before: null });
}

async function layoutContinue(freeVoice) {
  if (jobBusy()) return;
  syncLayoutFromDom();
  const bad = layoutProblems();
  if (bad.length && !current.interrupted) { layoutJump(bad[0].idx); return; }
  if (!current.interrupted && !(await layoutSaveOrShow())) return;   // an interrupted build is finished as it is
  await startLayoutJob(`/videos/${enc(current.folder)}/continue`, freeVoice ? { revoice_all: "edge" } : {});
}

function layoutJump(idx) {
  if (idx < 0) return;
  syncLayoutFromDom(); L.open = idx; renderLayout();
  $(`[data-l="${idx}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function askOpenLayout() {
  if (jobBusy()) return;
  const ok = await ask({ title: "Sửa bố cục?", yes: "Mở sửa bố cục",
    text: "Mở sửa bố cục. Video cũ vẫn giữ để xem. Bạn chưa duyệt đăng được cho tới khi dựng lại. Thêm hoặc đổi lời cảnh nào thì cảnh đó tốn 1 lượt đọc giọng." });
  if (!ok) return;
  try {
    if (dirty) await save();
    current = await api(`/videos/${enc(current.folder)}/layout/open`, { method: "POST" });
    dirty = false; banner = null; L = null;
    render(); loadList(); window.scrollTo(0, 0);
  } catch (e) { showBanner("bad", e.message); }
}

async function askCancelLayout() {
  if (jobBusy()) return;
  const ok = await ask({ title: "Bỏ các chỗ vừa sửa?", yes: "Bỏ các chỗ vừa sửa",
    text: "Bỏ mọi thay đổi bố cục và quay về video cũ? Không khôi phục được." });
  if (!ok) return;
  try {
    current = await api(`/videos/${enc(current.folder)}/layout/cancel`, { method: "POST" });
    dirty = false; L = null;
    banner = { kind: "ok", html: "Đã bỏ các chỗ vừa sửa, quay về video cũ." };
    render(); loadList();
  } catch (e) { showBanner("bad", e.message); await openVideo(current.folder, true); }   // reload: the button may be gone
}

// Cost of the voice, shown next to the build button (DR-0014 4.4)
function voiceCost() {
  const need = L.scenes.filter(needsVoice).length, engine = current.voice_engine;
  if (engine !== "gemini") return { text: "Giọng miễn phí, không tốn lượt.", short: false };
  if (!need) return { text: "Không cần đọc giọng mới, không tốn lượt.", short: false };
  if (!quota.available) return { text: `Sẽ đọc giọng ${need} cảnh, khoảng ${need} lượt Gemini (chưa xem được số lượt còn lại).`, short: false };
  const first = !L.scenes.some((s) => s.has_audio);
  const row = first ? (chain().find((m) => m.left >= need) || chain()[0]) : modelRow(current.voice_model);
  const left = row ? row.left : 0;
  if (left >= need) return { text: `Sẽ đọc giọng ${need} cảnh, khoảng ${need} lượt Gemini, hôm nay còn ${left}.`, short: false };
  return { text: `Không đủ lượt Gemini hôm nay (cần ${need}, còn ${left}). Cả video sẽ dùng giọng miễn phí (giọng khác hẳn).`, short: true };
}

function updateLayoutBar() {
  if (!L || !current || !current.stage) return;
  syncLayoutFromDom();
  const bar = $("#bar"), busy = jobBusy(), probs = layoutProblems(), cost = voiceCost(), locked = !!current.interrupted;
  $("#main").classList.toggle("busy", busy || locked);   // an interrupted build: only "Dựng" may go on
  let why;
  if (busy) why = esc("Đang chạy, đợi một chút…");
  else if (locked) why = esc("Lần dựng trước bị ngắt giữa chừng. Bấm Dựng video theo bố cục này để làm tiếp.");
  else if (probs.length) {
    why = `Chưa dựng được: <button type="button" class="linkbtn" data-l-jump="${probs[0].idx}">${esc(probs[0].msg)}</button>`;
  } else why = esc((dirty ? "Có thay đổi chưa lưu (bấm Dựng sẽ tự lưu bố cục). " : "") + cost.text);
  const shortActs = !busy && !locked && !probs.length && cost.short
    ? `<button class="btn small" data-act="cont-edge">Dùng giọng miễn phí cho cả video</button><button class="btn small" data-act="later">Để mai</button>` : "";
  bar.hidden = false;
  bar.innerHTML = `<span class="why">${why}</span>${shortActs}
    <button class="btn" id="b-lsave" ${!dirty || busy || locked ? "disabled" : ""}>Lưu bố cục</button>
    <button class="btn primary" id="b-lcont" ${busy || (probs.length && !locked) ? "disabled" : ""}>Dựng video theo bố cục này</button>
    ${current.can_cancel_layout && !locked ? `<button class="btn quiet" id="b-lcancel" ${busy ? "disabled" : ""}>Bỏ các chỗ vừa sửa</button>` : ""}`;
  $("#b-lsave").onclick = async () => {
    if (await layoutSave()) { banner = { kind: "ok", html: "Đã lưu bố cục." }; renderLayout(); say("Đã lưu"); }
    else { showBanner("bad", L.err.msg); renderLayout(); }
  };
  $("#b-lcont").onclick = () => layoutContinue(false);
  if ($("#b-lcancel")) $("#b-lcancel").onclick = () => askCancelLayout();
}

function lsceneMarkup(s, i) {
  const n = L.scenes.length, open = L.open === i, empty = !norm(s.line);
  const tag = i === 0 && s.kind !== "cta" ? "Mở đầu" : KINDS[s.kind] || "Cảnh";
  const err = L.err && L.err.idx === i ? L.err.msg : "";
  let body = "";
  if (open) {
    const imgs = current.product_images || [];
    let pick = "";
    if (s.kind === "product" || s.kind === "topic") {
      pick = imgs.length
        ? `<label class="f">Ảnh cảnh này <small>mặc định "Tự chọn"</small></label><div class="imgpick">
            <label><input type="radio" name="l-img" value="" ${s.image_slot === null ? "checked" : ""}><span class="auto">Tự chọn</span></label>
            ${imgs.map((p) => `<label><input type="radio" name="l-img" value="${p.slot}" ${s.image_slot === p.slot ? "checked" : ""}>${
              p.url ? `<img src="${esc(p.url)}" alt="Ảnh ${p.slot + 1}">` : `<span class="auto">Ảnh ${p.slot + 1}</span>`}</label>`).join("")}</div>`
        : `<div class="hint">Chưa có ảnh nào, video sẽ dùng nền trơn. ${current.can_cancel_layout
            ? "Muốn thêm ảnh: bấm 'Dựng video theo bố cục này' trước, rồi tải ảnh ở màn xem video và dựng lại."
            : '<button type="button" class="linkbtn" style="color:var(--info)" data-l-addimg>Thêm ảnh sản phẩm</button>'}</div>`;
    }
    const lock = s.locked ? `<div class="hint">${esc(s.locked_reason)}</div>` : "";
    const canUp = !s.locked && i > 0 && !L.scenes[i - 1].locked, canDown = !s.locked && i < n - 1 && !L.scenes[i + 1].locked;
    const prev = s.sid && L.prev[s.sid]
      ? `<button type="button" class="btn small" data-l-undo>Dùng lại câu cũ</button>` : "";
    body = `<div class="lbody">
      <label class="f" for="l-line">Lời đọc <small>giọng sẽ đọc</small></label>
      <textarea id="l-line" rows="3" class="${empty ? "invalid" : ""}">${esc(s.line)}</textarea>
      <div class="ferr" id="l-empty" ${empty ? "" : "hidden"}>Chưa có lời đọc, bấm 'AI viết lại cảnh này' hoặc tự gõ</div>
      ${err ? `<div class="ferr">${esc(err)}</div>` : ""}
      <label class="f" for="l-text">Chữ trên hình <small>chữ lớn trên video</small></label>
      <input type="text" id="l-text" value="${esc(s.text)}">
      <details><summary>Ý cảnh <small>để AI hiểu, không hiện trong video</small></summary>
        <textarea id="l-brief" rows="2">${esc(s.brief)}</textarea></details>
      ${pick}
      ${lock}
      <div class="lacts">
        <button type="button" class="btn" data-l-up ${canUp ? "" : "disabled"} aria-label="Đưa cảnh lên">↑</button>
        <button type="button" class="btn" data-l-down ${canDown ? "" : "disabled"} aria-label="Đưa cảnh xuống">↓</button>
        <button type="button" class="btn" data-l-del ${s.locked || n <= LAYOUT_MIN ? "disabled" : ""}>Xoá cảnh</button>
      </div>
      <label class="f" for="l-instr">Yêu cầu cho AI <small>không bắt buộc, ví dụ: ngắn hơn, vui hơn</small></label>
      <input type="text" id="l-instr" maxlength="500">
      <div class="lacts"><button type="button" class="btn" data-l-rewrite>AI viết lại cảnh này</button>${prev}</div>
    </div>`;
  }
  return `<div class="lscene ${open ? "open" : ""} ${empty ? "bad" : ""}" data-l="${i}">
    <button type="button" class="lhead" data-l-toggle="${i}" aria-expanded="${open}">
      <b>Cảnh ${i + 1}</b><span class="chip">${esc(tag)}</span>
      <span class="chip re" data-l-re ${needsVoice(s) && !empty ? "" : "hidden"}>Cần đọc giọng</span>
      <span class="lsum ${empty ? "err" : ""}">${empty ? "Chưa có lời đọc" : esc(shorten(s.line))}</span></button>${body}</div>`;
}

function renderLayout() {
  const v = current, main = $("#main");
  if (!L || L.folder !== v.folder) layoutFromDetail(v);
  const n = L.scenes.length, lastLocked = n && L.scenes[n - 1].locked;
  const addBtn = (pos) => (pos === n && lastLocked ? "" :
    `<button type="button" class="add-here" data-l-add="${pos}" ${n >= LAYOUT_MAX ? `disabled title="Tối đa ${LAYOUT_MAX} cảnh"` : ""}>+ Thêm cảnh ở đây</button>`);
  const scenes = L.scenes.map((s, i) => addBtn(i) + lsceneMarkup(s, i)).join("") + addBtn(n);
  const player = v.video_url
    ? `<div class="player"><video id="vid" controls playsinline preload="metadata" src="${esc(v.video_url)}#t=0.1"></video>
        <div class="hint">Video cũ, chưa theo bố cục mới</div></div>`
    : `<div class="player"><div class="noplayer">Chưa dựng video</div></div>`;
  main.innerHTML = `
    <button class="btn small back" id="back">← Danh sách</button>
    <div class="title-row"><h2>${esc(v.title)}</h2><span class="badge b-layout">${LABELS.layout}</span></div>
    ${stepsMarkup(1)}
    <div id="banner">${banner ? bannerMarkup() : ""}</div>
    ${v.interrupted ? '<div class="banner warn">Lần dựng trước bị ngắt giữa chừng nên chưa sửa bố cục được. Bấm <b>Dựng video theo bố cục này</b> để làm tiếp, rồi sửa sau.</div>' : ""}
    <div class="detail">${player}<div>
      <div class="card"><h3>Các cảnh (${n})</h3>
        <p class="sub">Mỗi cảnh là một đoạn của video. Bấm vào cảnh để sửa. Thêm, xoá hoặc đổi chỗ cảnh được; chưa tốn lượt giọng cho tới khi bạn bấm dựng.</p>
        ${scenes}</div>
      <div class="card"><h3>Chữ chung của video</h3>
        <label class="f" for="l-hook">Câu mở đầu (chữ lớn ở cảnh 1)</label><input type="text" id="l-hook" value="${esc(L.hook)}">
        <label class="f" for="l-caption">Lời giới thiệu đăng kèm</label><textarea id="l-caption" rows="3">${esc(L.caption)}</textarea>
        <label class="f" for="l-hashtags">Hashtag</label><input type="text" id="l-hashtags" value="${esc(L.hashtags)}">
        <div class="hint">Cách nhau bằng dấu cách.</div></div>
      <div class="card"><h3>Nhờ AI viết lại cả kịch bản</h3>
        <label class="f" for="l-instr-all">Yêu cầu cho AI <small>không bắt buộc</small></label>
        <input type="text" id="l-instr-all" maxlength="500">
        <div class="lacts"><button type="button" class="btn" data-l-rewrite-all>AI viết lại cả kịch bản</button></div></div>
    </div></div>`;
  L.err = null;
  $("#back").addEventListener("click", goBackToList);
  main.querySelectorAll("input, textarea").forEach((el) => el.addEventListener("input", () => {
    dirty = true; syncLayoutFromDom(); paintSceneFlags(); updateLayoutBar();
  }));
  main.querySelectorAll("input[type=radio]").forEach((el) => el.addEventListener("change", () => { dirty = true; updateLayoutBar(); }));
  updateLayoutBar();
}

async function goBackToList() {
  if (!(await leaveOk())) return;
  current = null; mode = null; dirty = false; banner = null; L = null;
  history.replaceState(null, "", location.pathname);
  document.body.classList.remove("has-detail");
  $("#bar").hidden = true;
  $("#main").innerHTML = '<p class="empty">Chọn một video ở danh sách bên trái hoặc bấm <b>+ Tạo video mới</b>.</p>';
  loadList();
}

// Typing: only the flags of the open scene change; the page is not rebuilt (keeps the cursor)
function paintSceneFlags() {
  const s = L.scenes[L.open], el = $(`[data-l="${L.open}"]`);
  if (!s || !el) return;
  const empty = !norm(s.line);
  el.classList.toggle("bad", empty);
  $("#l-line")?.classList.toggle("invalid", empty);
  if ($("#l-empty")) $("#l-empty").hidden = !empty;
  const sum = el.querySelector(".lsum");
  sum.classList.toggle("err", empty);
  sum.textContent = empty ? "Chưa có lời đọc" : shorten(s.line);
  el.querySelector("[data-l-re]").hidden = empty || !needsVoice(s);
}

function pickLayoutImage() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/png,image/jpeg,image/webp";
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { showBanner("bad", "Ảnh quá lớn (tối đa 15 MB)."); return; }
    if (!(await layoutSaveOrShow())) return;
    try {
      const idx = Math.min((current.product_images || []).length, MAX_PRODUCT_IMAGES - 1);
      current = await api(`/videos/${enc(current.folder)}/image?target=product&index=${idx}`,
        { method: "POST", body: file, headers: { "Content-Type": "application/octet-stream" } });
      layoutFromDetail(current);
      banner = { kind: "ok", html: "Đã nhận ảnh. Chọn ảnh cho từng cảnh nếu muốn." };
      renderLayout();
    } catch (e) { showBanner("bad", e.message); }
  };
  input.click();
}

document.addEventListener("click", (e) => {
  if (!L || !current || !current.stage || mode !== "detail") return;
  const t = e.target.closest("button"), root = $("#main");
  if (!t || !root.contains(t)) return;
  const idx = L.open;
  if (t.dataset.lToggle !== undefined) { syncLayoutFromDom(); L.open = L.open === +t.dataset.lToggle ? -1 : +t.dataset.lToggle; renderLayout(); }
  else if (t.dataset.lAdd !== undefined) layoutAdd(+t.dataset.lAdd);
  else if (t.hasAttribute("data-l-up")) layoutMove(idx, -1);
  else if (t.hasAttribute("data-l-down")) layoutMove(idx, 1);
  else if (t.hasAttribute("data-l-del")) layoutDelete(idx);
  else if (t.hasAttribute("data-l-rewrite")) layoutRewrite(idx);
  else if (t.hasAttribute("data-l-rewrite-all")) layoutRewriteAll();
  else if (t.hasAttribute("data-l-addimg")) pickLayoutImage();
  else if (t.hasAttribute("data-l-undo")) {
    const s = L.scenes[idx], p = L.prev[s.sid];
    if (p) { s.line = p.line; s.text = p.text; delete L.prev[s.sid]; dirty = true; renderLayout(); }
  }
});
document.addEventListener("click", (e) => {   // buttons of the bottom bar and of banners
  const b = e.target.closest("button");
  if (!b || !L) return;
  if (b.dataset.lJump !== undefined) layoutJump(+b.dataset.lJump);
  else if (b.dataset.act === "cont-edge") askContinueFree();
  else if (b.dataset.act === "later") { banner = { kind: "info", html: "Được. Bố cục đã giữ nguyên, bạn quay lại bấm dựng vào ngày mai." }; paintBanner(); }
  else if (b.dataset.act === "dismiss") { banner = null; paintBanner(); }
});

async function askContinueFree() {
  const ok = await ask({ title: "Dùng giọng miễn phí cho cả video?", yes: "Dùng giọng miễn phí",
    text: "Cả video sẽ được đọc lại bằng giọng miễn phí, giọng mọi cảnh sẽ thay đổi và kém tự nhiên hơn Gemini. Không tốn lượt Gemini." });
  if (ok) layoutContinue(true);
}

// continue / rewrite jobs ended
async function layoutJobFinished(job, log) {
  const f = job.folder || (current && current.folder), vi = /[À-ỹ]/;
  const notes = (job.notices || []).map((l) => l.replace(/^(\[[A-Z_]+\]|❌)\s*/, ""));
  if (job.state === "done") {
    if (job.action === "rewrite") {
      if (L) L.afterRewrite = L.pending || { sid: null };
      banner = { kind: "ok", html: "Đã viết lại. Đọc lại các cảnh rồi bấm Dựng video theo bố cục này." };
    } else {
      banner = { kind: "ok", html: "Đã dựng xong. Xem hết video và kiểm tra lời đọc trước khi bấm Duyệt & lưu." };
      L = null;
    }
    say(job.action === "rewrite" ? "Đã viết lại" : "Đã dựng xong video");
    await openVideo(f, true);
    return;
  }
  const kind = job.error_kind;
  if (L) L.pending = null;
  let html;
  if (kind === "rewrite_failed") html = "AI đang bận hoặc trả lời lỗi, kịch bản chưa đổi. Thử lại sau ít phút.";
  else if (kind === "fact_check") {
    html = "Con số trong video chưa khớp nguồn." + (notes.length ? `<pre>${esc(notes.slice(0, 6).join("\n"))}</pre>` : " ")
      + "Sửa số hoặc thêm link nguồn rồi bấm Dựng video theo bố cục này.";
  } else if (kind === "layout_not_ready") {
    const why = [...notes].reverse().find((l) => vi.test(l));
    html = why ? `Chưa dựng được: ${esc(why.replace(/\.$/, ""))}. Sửa rồi bấm lại.`
      : "Chưa dựng được vì bố cục chưa hợp lệ hoặc video không còn ở bước soạn bố cục. Tải lại trang rồi thử lại.";
  } else if (kind === "revoice") {
    html = "Đọc giọng bị lỗi, chưa đổi gì. Chọn: thử lại sau, hoặc đọc lại toàn bộ video bằng giọng miễn phí (giọng mọi cảnh sẽ thay đổi)."
      + `<div class="acts"><button class="btn small" data-act="cont-edge">Dùng giọng miễn phí cho cả video</button>`
      + `<button class="btn small" data-act="dismiss">Để sau</button></div>`;
  } else html = "Việc này chưa xong, dữ liệu của bạn vẫn nguyên. Thử lại sau ít phút.";
  banner = { kind: "bad", html: html + (kind === "revoice" || kind === "rewrite_failed" ? "" : log) };
  if (videos.some((v) => v.folder === f) || (current && current.folder === f)) await openVideo(f, true); else paintBanner();
}

// ---------------- banner ----------------
function bannerMarkup() {
  const cls = banner.kind === "job" ? "info" : banner.kind;
  return `<div class="banner ${cls}" role="status">${banner.html}</div>`;
}
function showBanner(kind, text) { banner = { kind, html: esc(text) }; paintBanner(); }
function paintBanner() {
  const el = $("#banner");
  if (el) el.innerHTML = banner ? bannerMarkup() : "";
  else if (banner) $("#main").insertAdjacentHTML("afterbegin", `<div id="banner">${bannerMarkup()}</div>`);
  if (mode === "create") updateCreateBar();
  else if (current) { paintVoice(); updateBar(); }  // buttons with data-act are handled by one document listener
}

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  loadQuota();
  try { await loadList(); }
  catch (e) { $("#list").innerHTML = `<li class="empty">${esc(e.message)}</li>`; return; }
  const job = await api("/job").catch(() => ({ state: "idle" }));
  const hash = decodeURIComponent(location.hash.slice(1));
  if (job.state === "running" && job.action === "create") {
    await openCreate(true);
    watchJob();
    return;
  }
  const wanted = job.state === "running" ? job.folder : hash;
  if (wanted === "new") await openCreate();
  else if (wanted && videos.some((v) => v.folder === wanted)) await openVideo(wanted);
  if (job.state === "running") watchJob();
})();
</script>
</body>
</html>
