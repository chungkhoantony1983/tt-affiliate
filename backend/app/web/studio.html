<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio duyệt video</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
  --accent: #e0245e; --accent-ink: #ffffff; --soft: #f1efea; --focus: #2f6fed;
  --ok: #1f7a3f; --ok-bg: #e3f4e8; --warn: #8a5a00; --warn-bg: #fdf1d6;
  --bad: #b3261e; --bad-bg: #fde7e5; --info-bg: #e8f0fe; --info: #1f4fb4;
  --fs-caption: 12px; --fs-note: 13px; --fs-small: 14px; --fs-body: 15px;
  --fs-h3: 17px; --fs-h1: 20px; --fs-h2: 22px;
  --radius: 12px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416; --panel: #1e1e21; --ink: #f2f2f3; --muted: #a0a0a8; --line: #33333a;
    --accent: #ff4f86; --accent-ink: #1a0610; --soft: #26262a; --focus: #7aa5ff;
    --ok: #7ad69a; --ok-bg: #173022; --warn: #f3c25b; --warn-bg: #352a10;
    --bad: #ff8a80; --bad-bg: #3a1a18; --info-bg: #1b2740; --info: #9dbbff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: var(--fs-h1); }
header p { margin: 0; color: var(--muted); font-size: var(--fs-small); }
header .quota { flex: 1 1 100%; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
.layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 58px); }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto;
  max-height: calc(100vh - 58px); position: sticky; top: 0; }
aside h2 { font-size: var(--fs-note); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 16px 8px; }
.aside-top { padding: 14px 12px 4px; }
.aside-top .btn { width: 100%; min-height: 44px; font-size: var(--fs-body); display: flex; align-items: center; justify-content: center; gap: 6px; }
.vlist { list-style: none; margin: 0; padding: 0 8px 16px; }
.vlist button { width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent;
  border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; }
.vlist button:hover { background: var(--soft); }
.vlist button[aria-current="true"] { background: var(--soft); border-left-color: var(--accent); }
.vlist .t { font-weight: 600; }
.vlist .m { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--fs-note); color: var(--muted); }
.badge { display: inline-block; font-size: var(--fs-caption); font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.b-review { background: var(--warn-bg); color: var(--warn); }
.b-needs_images { background: var(--bad-bg); color: var(--bad); }
.b-approved { background: var(--ok-bg); color: var(--ok); }
.b-view_only { background: var(--soft); color: var(--muted); }
.b-voice { background: var(--info-bg); color: var(--info); }
main { padding: 20px 24px 120px; min-width: 0; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.back { display: none; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.title-row h2 { margin: 0; font-size: var(--fs-h2); }
.detail { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 24px; align-items: start; }
.player { position: sticky; top: 16px; }
video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: var(--radius); display: block; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.card h3 { margin: 0 0 4px; font-size: var(--fs-h3); }
.card .sub { margin: 0 0 12px; color: var(--muted); font-size: var(--fs-small); }
label.f { display: block; font-size: var(--fs-small); font-weight: 600; margin: 12px 0 4px; }
input[type=text], input[type=number], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--bg); font: inherit; color: inherit; }
textarea { resize: vertical; min-height: 64px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.hint { font-size: var(--fs-note); color: var(--muted); margin-top: 4px; }
.price-preview { font-size: var(--fs-small); margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: var(--soft); }
.price-preview.bad-text { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.source-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.source-tabs .btn { flex: 1 1 200px; text-align: center; }
.source-tabs .btn[aria-pressed="true"] { background: var(--info-bg); color: var(--info); border-color: var(--focus); }
.create-wrap { max-width: 780px; }
.slot-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg);
  display: grid; gap: 6px; justify-items: center; flex: 1 1 140px; max-width: 220px; }
.slot-card .slot-title { font-size: var(--fs-note); font-weight: 600; text-align: center; }
.slot-card .thumb { width: 104px; aspect-ratio: 1; }
.slot-card .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.style-choices { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.style-choice { flex: 1 1 220px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: var(--bg); cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
.style-choice input { margin-top: 4px; }
.style-choice b { display: block; font-size: var(--fs-small); }
.style-choice span { display: block; font-size: var(--fs-note); color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 14px;
  cursor: pointer; font-weight: 600; min-height: 42px; }
.btn:hover:not(:disabled) { background: var(--soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); background: var(--accent); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: var(--fs-small); }
.scene { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.scene:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.scene-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.scene-head b { font-size: var(--fs-body); }
.chip { font-size: var(--fs-caption); padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.chip.re { background: var(--info-bg); color: var(--info); font-weight: 600; }
.scene-img { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.scene-img .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { width: 72px; aspect-ratio: 9 / 16; border-radius: 8px; object-fit: cover; background: var(--soft);
  border: 1px dashed var(--line); display: grid; place-items: center; font-size: var(--fs-caption); color: var(--muted); text-align: center; }
.pimgs { display: flex; gap: 14px; flex-wrap: wrap; }
.pimg { display: grid; gap: 6px; justify-items: center; }
.pimg .thumb { width: 96px; aspect-ratio: 1; }
.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; font-size: var(--fs-body); }
.banner.info { background: var(--info-bg); color: var(--info); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.banner .acts { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.banner .acts .btn { max-width: 100%; text-align: left; }
.banner .hint { color: inherit; }
dialog .extra { font-weight: 600; color: var(--warn); }
.banner details { margin-top: 8px; font-size: var(--fs-note); }
.banner pre { white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; margin: 6px 0 4px; color: var(--ink); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
  border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.actionbar { position: fixed; left: 320px; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5; }
.actionbar[hidden] { display: none; }
.actionbar .why { color: var(--muted); font-size: var(--fs-small); flex: 1 1 200px; }
dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink);
  max-width: 440px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog h3 { margin-top: 0; }
dialog .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.copy-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.fact { border-top: 1px solid var(--line); padding: 10px 0; font-size: var(--fs-small); }
.fact:first-of-type { border-top: 0; }
.fact q { display: block; color: var(--muted); font-size: var(--fs-note); margin: 4px 0; quotes: none; }
.credit { font-size: var(--fs-note); color: var(--muted); padding: 4px 0; }
.fact.hl { background: var(--info-bg); border-radius: 8px; padding-left: 8px; }
button.chip { border: 0; cursor: pointer; }
.cmd { user-select: all; white-space: pre-wrap; word-break: break-all; min-width: 0; max-width: 100%; }
.banner { min-width: 0; overflow-wrap: anywhere; }
.chip.stale { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.detail > * { min-width: 0; }
@media (max-width: 900px) {
  .detail { grid-template-columns: minmax(0, 1fr); }
  .player { position: static; max-width: 340px; margin: 0 auto; width: 100%; }
}
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  aside { max-height: none; position: static; border-right: 0; }
  body.has-detail aside { display: none; }
  body:not(.has-detail) main { display: none; }
  main { padding: 16px 16px 150px; }
  .back { display: inline-flex; margin-bottom: 10px; }
  .actionbar { left: 0; padding: 10px 16px; }
  .actionbar .btn { flex: 1 1 auto; }
  header { padding: 12px 16px; }
  .slot-card { max-width: none; }
}
</style>
</head>
<body>
<header>
  <h1>Studio duyệt video</h1>
  <p>Tạo video sản phẩm mới, xem và sửa chữ, dựng lại, rồi duyệt.</p>
  <p class="quota" id="quota" role="status">Đang xem số lượt giọng Gemini…</p>
</header>
<div class="layout">
  <aside>
    <div class="aside-top">
      <button class="btn primary" id="b-new-video">+ Tạo video mới</button>
    </div>
    <h2>Video trên máy</h2>
    <ul class="vlist" id="list"><li class="empty">Đang tải…</li></ul>
  </aside>
  <main id="main"><p class="empty">Chọn một video ở danh sách bên trái hoặc bấm <b>+ Tạo video mới</b>.</p></main>
</div>
<div class="actionbar" id="bar" hidden></div>

<dialog id="confirm" aria-labelledby="confirm-title">
  <h3 id="confirm-title"></h3>
  <p id="confirm-text"></p>
  <p class="extra" id="confirm-extra" hidden></p>
  <div class="acts">
    <button class="btn" id="confirm-no">Để sau</button>
    <button class="btn primary" id="confirm-yes"></button>
  </div>
</dialog>
<div class="sr" aria-live="polite" id="live"></div>

<script>
"use strict";
// Travel folders (DR-0002). All strings from the folder go through esc(); links need https:// (T-17).
const TRAVEL_KINDS = { hook: "Mở đầu", answer: "Trả lời", outro: "Kết" };

function safeLink(url, label) {
  const u = String(url || "");
  if (!u.startsWith("https://")) return esc(label || u);
  return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label || u)}</a>`;
}

function langName(code) {
  try {
    const n = new Intl.DisplayNames(["vi"], { type: "language" }).of(code);
    if (n && n.toLowerCase() !== String(code).toLowerCase()) return n.charAt(0).toLowerCase() + n.slice(1);
  } catch { /* fall through */ }
  return String(code).toUpperCase();
}

const shq = (s) => "'" + String(s).replace(/'/g, "'\\''") + "'";

// Ready-to-paste Terminal command, with cd to the project root (the Terminal may be anywhere)
function refreshCmd(root, folder, confirmIds) {
  const base = `cd ${shq(root)} && .venv/bin/python demo.py --travel --refresh-facts ${shq("storage/videos/" + folder)}`;
  return confirmIds && confirmIds.length ? `${base} --confirm ${confirmIds.map(shq).join(",")}` : base;
}

function cmdBlock(root, folder, confirmIds) {
  let html = `<div class="hint">Chép lệnh này, dán vào Terminal rồi nhấn Enter:</div><pre class="cmd">${esc(refreshCmd(root, folder, []))}</pre>`;
  if (confirmIds && confirmIds.length) {
    html += `<div class="hint">Dữ kiện nhập tay (${esc(confirmIds.join(", "))}) cần bạn xác nhận đã kiểm lại trang nguồn. Sau khi kiểm, dùng lệnh này:</div>`
      + `<pre class="cmd">${esc(refreshCmd(root, folder, confirmIds))}</pre>`;
  }
  return html + "<div>Chạy xong, quay lại đây bấm Duyệt lần nữa.</div>";
}

function travelStaleBanner(v) {
  const ids = v.stale_ids || [];
  if (!ids.length) return "";
  const labels = v.stale_labels || {};
  const list = ids.map((id) => labels[id] ? `${id} (${labels[id]})` : id).join("; ");
  return `<div class="banner warn">Có dữ kiện quá 30 ngày: ${esc(list)}. Bạn sẽ không duyệt được cho đến khi làm mới nguồn (mất khoảng 1 phút, miễn phí).`
    + cmdBlock(v.repo_root, v.folder, v.confirm_ids) + "</div>";
}

function travelSubsOf(s) {
  const out = {};
  for (const lang of current.subtitle_langs) {
    const el = $(`[data-sub="${s.index}"][data-lang="${lang}"]`);
    if (el) out[lang] = el.value;
  }
  return out;
}

function travelSubsChanged(s, subs) {
  return Object.keys(subs || {}).some((lang) => norm(subs[lang]) !== norm((s.subs || {})[lang]));
}

function travelEditNote() {
  const n = current.segments.filter((s) =>
    norm($(`[data-line="${s.index}"]`).value) !== norm(s.line)
    || ($(`[data-text="${s.index}"]`).value || "").trim() !== (s.text || "")
    || travelSubsChanged(s, travelSubsOf(s))).length;
  return n ? `<div class="banner info">Bạn đã sửa ${n} cảnh, bấm <b>Dựng lại video</b> để đưa vào video.</div>` : "";
}

function creditLine(c) {
  return `${safeLink(c.page, c.provider || "Nguồn")} · ${esc(c.author || "không rõ tác giả")} · ${esc(c.license || "không rõ giấy phép")}`;
}

function travelSceneMarkup(s) {
  const subs = current.subtitle_langs.map((lang) => `
    <label class="f" for="sub-${s.index}-${esc(lang)}">Phụ đề ${esc(langName(lang))}</label>
    <textarea id="sub-${s.index}-${esc(lang)}" rows="2" data-sub="${s.index}" data-lang="${esc(lang)}">${esc((s.subs || {})[lang] || "")}</textarea>`).join("");
  const hint = current.subtitle_langs.length ? '<div class="hint">Sửa số thì phải trùng số trong Dữ kiện.</div>' : "";
  const ids = (s.fact_ids || []).map((id) => `<button type="button" class="chip" data-factref="${esc(id)}" title="Xem dữ kiện này">Dữ kiện: ${esc(id)}</button>`).join("");
  const clips = current.credits.filter((c) => (c.scenes || []).includes(s.index + 1))
    .map((c) => `<div class="hint">Hình cảnh này: ${creditLine(c)}</div>`).join("");
  return `<div class="scene" data-scene="${s.index}">
    <div class="scene-head"><b>Cảnh ${s.index + 1}</b><span class="chip">${esc(TRAVEL_KINDS[s.kind] || "Cảnh")}</span>${ids}
      <span class="chip re" data-re hidden>Sẽ đọc lại</span></div>
    <label class="f" for="line-${s.index}">Lời đọc</label>
    <textarea id="line-${s.index}" rows="3" data-line="${s.index}">${esc(s.line)}</textarea>
    <label class="f" for="text-${s.index}">Chữ trên màn hình (ngắn, tối đa ${s.kind === "hook" ? 10 : 6} từ)</label>
    <input type="text" id="text-${s.index}" data-text="${s.index}" value="${esc(s.text)}">
    ${subs}${hint}${clips}</div>`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-factref]");
  if (!b) return;
  const el = [...document.querySelectorAll("[data-fact]")].find((x) => x.dataset.fact === b.dataset.factref);
  if (!el) return;
  document.querySelectorAll(".fact.hl").forEach((x) => x.classList.remove("hl"));
  el.classList.add("hl");
  el.scrollIntoView({ behavior: "smooth", block: "center" });
});

function travelCards(v) {
  const facts = (v.facts || []).map((f) => `<div class="fact" data-fact="${esc(f.id)}">
      <div><b>${esc(f.claim)}</b> ${f.manual ? '<span class="chip">nhập tay</span>' : ""} ${f.stale ? '<span class="chip stale">Quá 30 ngày</span>' : ""}</div>
      <q>“${esc(f.quote)}”</q>
      <div>${f.url ? safeLink(f.url, f.source_name || f.url) : "link nguồn không có"}${f.checked_on ? ` · kiểm ngày ${esc(f.checked_on)}` : ""}${f.id ? ` · ${esc(f.id)}` : ""}</div>
    </div>`).join("");
  const dropped = v.facts_dropped
    ? `<div class="banner warn">Có ${esc(v.facts_dropped)} dữ kiện không hiện vì link nguồn không hợp lệ hoặc không thuộc nguồn cho phép. `
      + "Nhờ người phụ trách kỹ thuật kiểm tra, hoặc xoá trạng thái trong tab Travel và tạo lại video. Đừng duyệt khi chưa kiểm lại nguồn.</div>" : "";
  const credits = (v.credits || []).map((c) => `<div class="credit">${c.scenes && c.scenes.length ? "Cảnh " + esc(c.scenes.join(", ")) + ": " : ""}${creditLine(c)}</div>`).join("");
  return `<div class="card"><h3>Dữ kiện và nguồn</h3>
      <p class="sub">Kiểm từng dữ kiện với trang nguồn trước khi duyệt. Lời đọc chỉ được dùng các con số có ở đây.</p>
      ${dropped}${facts || '<div class="hint">Chưa có dữ kiện nào.</div>'}</div>
    <div class="card"><h3>Hình và bản quyền</h3>
      <p class="sub">Nguồn clip và ảnh trong video. Muốn thay clip sai thì ghi lại số cảnh ở đây.</p>
      ${credits || '<div class="hint">Chưa có thông tin nguồn hình.</div>'}
      <div class="hint">Ảnh giấy phép CC BY / CC BY-SA đã có tên tác giả hiện trên video.</div></div>`;
}

function travelErrorHtml(job) {
  const stale = job.error_kind === "facts_stale";
  const lines = (job.notices || []).filter((l) => l.startsWith(stale ? "[FACTS_STALE] " : "[FACT_CHECK] "));
  const shown = lines.map((l) => l.replace(/^\[[A-Z_]+\]\s*/, "")).slice(0, 6);
  const pre = shown.length ? `<pre>${esc(shown.join("\n"))}</pre>` : "";
  if (stale) {
    const m = /--confirm[ =]([\w,-]+)/.exec(lines.join(" "));
    const confirmIds = m ? m[1].split(",").filter(Boolean) : (current && current.confirm_ids) || [];
    return "Chưa duyệt được: có dữ kiện dễ đổi (visa, phí, giá…) đã kiểm quá 30 ngày." + pre
      + cmdBlock(job.repo_root || "", job.folder, confirmIds);
  }
  return (shown.length ? "Con số trong video chưa khớp nguồn, nên chưa dựng lại:" + pre
      : "Có con số trong lời đọc hoặc phụ đề không có trong nguồn, nên chưa dựng lại. ")
    + "Video và giọng cũ vẫn giữ nguyên. Sửa rồi bấm Lưu, rồi Dựng lại video.";
}
</script>
<script>
"use strict";
const API = "/api/studio";
const LABELS = { review: "Chờ duyệt", needs_images: "Cần ảnh", approved: "Đã duyệt", view_only: "Chỉ xem" };
const SPEAKERS = { narrator: "Người dẫn", con_gai: "Con gái", con_trai: "Con trai", me: "Mẹ", bo: "Bố", ba: "Bà", ong: "Ông" };

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function formatVndDots(n) {
  return String(Math.max(0, Math.trunc(Number(n) || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function readThreeDigits(num, fullHundred) {
  const h = Math.floor(num / 100), t = Math.floor((num % 100) / 10), u = num % 10;
  const out = [];
  if (h > 0 || fullHundred) out.push(VN_DIGITS[h] + " trăm");
  if (t === 0 && u > 0 && (h > 0 || fullHundred)) out.push("lẻ");
  else if (t === 1) out.push("mười");
  else if (t > 1) out.push(VN_DIGITS[t] + " mươi");
  if (u > 0) {
    if (t > 1 && u === 1) out.push("mốt");
    else if (t >= 1 && u === 5) out.push("lăm");
    else if (t > 1 && u === 4) out.push("tư");
    else out.push(VN_DIGITS[u]);
  }
  return out.join(" ");
}

function readVndWords(n) {
  n = Math.trunc(Number(n) || 0);
  if (n <= 0) return "Không đồng";
  const scales = ["", "nghìn", "triệu", "tỷ"];
  const groups = [];
  let rem = n;
  while (rem > 0) {
    groups.push(rem % 1000);
    rem = Math.floor(rem / 1000);
  }
  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] === 0) continue;
    const text = readThreeDigits(groups[i], i < groups.length - 1);
    const scale = scales[i] || "";
    parts.push(scale ? `${text} ${scale}` : text);
  }
  const s = parts.join(" ").trim() + " đồng";
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function parsePriceRaw(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return { empty: true, value: null, invalid: false };
  if (/^-/.test(s)) return { empty: false, value: -1, invalid: true };
  const digits = s.replace(/[^\d]/g, "");
  if (!digits) return { empty: true, value: null, invalid: false };
  const n = parseInt(digits, 10);
  const invalid = n < 0 || (n > 0 && n < 1000);
  return { empty: false, value: n, invalid };
}

function pricePreviewMarkup(raw, { allowEmpty = false, oldPrice = null } = {}) {
  const p = parsePriceRaw(raw);
  if (p.empty) {
    return allowEmpty
      ? '<div class="hint">Để trống nếu muốn máy tự lấy giá từ link/bảng tính, hoặc nhập <b>0</b> nếu muốn ẩn giá.</div>'
      : '<div class="price-preview"><b>Không hiện giá trên video</b></div>';
  }
  if (p.invalid) {
    return '<div class="price-preview bad-text">Giá đang dưới 1.000đ. Kiểm tra lại xem bạn có gõ thiếu 3 số 0 (ví dụ 189.000) không, hoặc nhập 0 nếu muốn ẩn giá.</div>';
  }
  let html = p.value === 0
    ? '<div class="price-preview"><b>Không hiện giá trên video</b></div>'
    : `<div class="price-preview">Sẽ hiện trên video: <b>${formatVndDots(p.value)}đ (${readVndWords(p.value)})</b></div>`;
  if (oldPrice !== null && p.value !== oldPrice) {
    html += '<div class="banner warn" style="margin-top:8px;margin-bottom:0;padding:8px 12px;font-size:var(--fs-small)">Bạn vừa đổi giá. Hãy liếc kiểm tra Lời giới thiệu và Lời đọc các cảnh bên dưới xem có câu nào đang nhắc tới giá cũ không nhé.</div>';
  }
  return html;
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.method && opts.method !== "GET") headers["X-Studio"] = "1";
  if (opts.json !== undefined) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  let res;
  try { res = await fetch(API + path, { ...opts, headers }); }
  catch { throw new Error("Không kết nối được máy chủ Studio. Kiểm tra cửa sổ Terminal của Studio còn mở không."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : "Có lỗi, thử lại sau (mã " + res.status + ")");
  }
  return data;
}

function when(folder) {
  const m = /^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/.exec(folder);
  return m ? `${m[3]}/${m[2]} ${m[4]}:${m[5]}` : "";
}

// ---------------- confirm dialog (shared: approve, switch voice, discard edits) ----------------
function ask({ title, text, extra = "", yes, no = "Để sau" }) {
  const dlg = $("#confirm");
  if (dlg.open) return Promise.resolve(false);  // one question at a time
  $("#confirm-title").textContent = title;
  $("#confirm-text").textContent = text;
  $("#confirm-extra").textContent = extra;
  $("#confirm-extra").hidden = !extra;
  $("#confirm-yes").textContent = yes;
  $("#confirm-no").textContent = no;
  return new Promise((resolve) => {
    let answer = false;
    $("#confirm-yes").onclick = () => { answer = true; dlg.close(); };
    $("#confirm-no").onclick = () => dlg.close();
    dlg.onclose = () => resolve(answer);  // also Esc
    dlg.showModal();
  });
}

// ---------------- Gemini voice quota ----------------
const two = (n) => String(n).padStart(2, "0");
const clock = (d) => `${two(d.getHours())}:${two(d.getMinutes())}`;
function dayWord(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  const days = Math.round((b - a) / 86400000);
  return days === 0 ? "hôm nay" : days === 1 ? "ngày mai" : `ngày ${two(d.getDate())}/${two(d.getMonth() + 1)}`;
}
// "khoảng 15:00 hôm nay" / "khoảng 15:00 ngày mai", by this computer's clock and date
function about(iso) {
  const d = new Date(iso);
  return iso && !isNaN(d) ? `khoảng ${clock(d)} ${dayWord(d)}` : "khi có lại lượt";
}
// "10:45" (plus the day when it is not today), for the short 60-minute pause
function until(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d)) return "một lúc nữa";
  const day = dayWord(d);
  return clock(d) + (day === "hôm nay" ? "" : " " + day);
}

const chain = () => (quota.models || []).filter((m) => m.role === "main" || m.role === "backup");
// A short pause (60 minutes after an unclear "too many requests" answer) that ends with requests left
const paused = (m) => m.block_reason === "unknown_429" && m.blocked_until && m.used < quota.limit;
// Quota row of the model a video was voiced with (older videos: the main model)
function modelRow(name) {
  const rows = quota.models || [];
  if (!name) return rows.find((m) => m.role === "main") || null;
  return rows.find((m) => m.model === name) || { model: name, role: "other", used: 0, left: quota.limit, blocked_until: null };
}
// When this model has requests again
const backAt = (row) => (row && paused(row) ? row.blocked_until : quota.resets_at);
// When some Gemini voice can read `need` lines again
function chainBackAt(need) {
  const times = chain().filter((m) => paused(m) && quota.limit - m.used >= need).map((m) => m.blocked_until);
  return times.sort()[0] || quota.resets_at;
}

function quotaText() {
  if (!quota.available) return "Chưa xem được số lượt Gemini còn lại. Bạn vẫn dựng lại được; nếu hết lượt, máy sẽ báo và giữ nguyên video cũ.";
  if (quota.provider !== "gemini") return "Đang dùng giọng miễn phí, không giới hạn lượt.";
  const rows = chain(), main = rows.find((m) => m.role === "main"), backs = rows.filter((m) => m.role === "backup");
  if (rows.every((m) => m.left === 0)) {
    const pause = rows.filter(paused).map((m) => m.blocked_until).sort()[0];
    return pause
      ? `Giọng Gemini đang tạm nghỉ đến ${until(pause)}. Trong lúc đó video mới sẽ dùng giọng miễn phí.`
      : `Giọng Gemini đã hết lượt. Video mới sẽ dùng giọng miễn phí cho đến ${about(quota.resets_at)}.`;
  }
  const mainLeft = main ? main.left : 0;
  const left = backs.length ? `còn ${mainLeft} lượt chính và ${backs.reduce((n, m) => n + m.left, 0)} lượt phụ` : `còn ${mainLeft} lượt`;
  const enough = quota.videos_left > 0 ? `đủ cho khoảng ${quota.videos_left} video mới` : "chưa đủ cho một video mới";
  return `Giọng Gemini: ${left} · ${enough} · có lại đủ lượt lúc ${about(quota.resets_at)}`;
}

  $("#quota").textContent = quotaText();

// Line at the top of a video: which voice it has, and the way back to the Gemini voice
function paintVoice() {
  const el = $("#voiceline"), v = current;
  if (!el || !v) return;
  const role = v.voice_role;
  if (!VOICE_NAMES[role]) { el.innerHTML = ""; return; }
  if (v.label === "view_only") {
    el.innerHTML = `<div class="banner info">Giọng của video: ${VOICE_NAMES[role]}</div>`;
    return;
  }
  if (role === "main") { el.innerHTML = `<div class="banner info">Giọng của video: Gemini</div>`; return; }
  if (role === "backup") { el.innerHTML = `<div class="banner warn">Giọng của video: Gemini phụ. Nghe kỹ trước khi duyệt.</div>`; return; }

  const need = v.voice_calls || 0;
  const row = quota.available ? chain().find((m) => m.left >= need) : null;   // the Gemini voice that can read the whole video
  const offer = !quota.available || quota.provider === "gemini";
  const waitFor = quota.available && offer && !row && need <= quota.limit ? about(chainBackAt(need)) : "";
  let text;
  if (v.voice_reason === "quota") {
    text = "Video này đang dùng giọng miễn phí vì lúc tạo giọng Gemini không đủ lượt. Bạn có thể duyệt luôn, hoặc "
      + (waitFor ? `đợi có lại lượt (${waitFor}) rồi ` : "") + "bấm Đọc lại toàn bộ bằng giọng Gemini.";
  } else if (v.voice_reason === "error") {
    text = "Lúc tạo, không kết nối được giọng Gemini (không phải do hết lượt). Nếu lặp lại, báo người phụ trách kỹ thuật.";
  } else {
    text = "Giọng của video: giọng miễn phí (không giới hạn lượt, kém tự nhiên hơn Gemini).";
  }
  let acts = "";
  if (offer) {
    const busy = jobBusy() ? "disabled" : "";
    if (!quota.available) {
      acts = `<div class="acts"><button class="btn small" data-act="regemini" ${busy}>Đọc lại toàn bộ bằng giọng Gemini</button></div>`;
    } else if (row) {
      acts = `<div class="acts"><button class="btn small" data-act="regemini" ${busy}>Đọc lại toàn bộ bằng giọng Gemini (dùng ${need} lượt, còn ${row.left})</button></div>`;
    } else {
      const why = waitFor ? `Chưa đủ lượt. Có lại lượt lúc ${waitFor}.`
        : "Video này có nhiều câu hơn số lượt Gemini trong một ngày.";
      acts = `<div class="acts"><button class="btn small" disabled>Đọc lại toàn bộ bằng giọng Gemini</button></div>
        <div class="hint">${esc(why)}</div>`;
    }
  }
  el.innerHTML = `<div class="banner ${v.voice_reason ? "warn" : "info"}">${esc(text)}${acts}</div>`;
}

async function askRevoice(engine) {
  if (!current || jobBusy()) return;
  const ok = engine === "gemini"
    ? await ask({ title: "Đọc lại bằng giọng Gemini?",
        text: `Cả video sẽ được đọc lại bằng giọng Gemini, dùng ${current.voice_calls} lượt. Tiếp tục?`,
        yes: "Đọc lại bằng giọng Gemini" })
    : await ask({ title: "Đổi sang giọng miễn phí?",
        text: "Cả video sẽ được đọc lại bằng giọng miễn phí, kém tự nhiên hơn giọng Gemini. Không tốn lượt Gemini. Tiếp tục?",
        yes: "Đổi sang giọng miễn phí" });
  if (ok) startRender(engine);
}

function leaveOk() {
  if (!dirty) return Promise.resolve(true);
  return ask({ title: "Bỏ thay đổi chưa lưu?", text: "Bạn có thay đổi chưa lưu. Bỏ các thay đổi đó?",
    yes: "Bỏ thay đổi", no: "Ở lại" });
}

async function openVideo(folder, keepBanner = false) {
  if ((mode === "detail" && current && current.folder !== folder || mode === "create") && !(await leaveOk())) return;
  try {
    current = await api("/videos/" + encodeURIComponent(folder));
  } catch (err) { showBanner("bad", err.message); return; }
  mode = "detail";
  dirty = false;
  if (!keepBanner) banner = null;
  history.replaceState(null, "", "#" + encodeURIComponent(folder));
  document.body.classList.add("has-detail");
  render();
  window.scrollTo(0, 0);
  loadList();
  loadQuota();
}

// ---------------- create new video ----------------
async function openCreate(keepState = false) {
  if (!(await leaveOk())) return;
  current = null;
  mode = "create";
  dirty = false;
  if (!keepState) {
    banner = null;
    createState = emptyCreateState();
  }
  history.replaceState(null, "", "#new");
  document.body.classList.add("has-detail");
  renderCreate();
  window.scrollTo(0, 0);
  loadList();
  await loadSheetRows();
}

async function loadSheetRows() {
  try {
    const data = await api("/sheet-rows");
    createState.sheetAvailable = !!data.available;
    createState.sheetRows = data.rows || [];
    createState.sheetMessage = data.message || "";
    if (mode === "create") paintSheetSelect();
  } catch {
    createState.sheetAvailable = false;
    createState.sheetRows = [];
  }
}

function syncCreateDomToState() {
  if (mode !== "create") return;
  if ($("#c-url")) createState.productUrl = $("#c-url").value;
  if ($("#c-sheet-row")) createState.sheetRow = $("#c-sheet-row").value;
  if ($("#c-name")) createState.name = $("#c-name").value;
  if ($("#c-price")) createState.priceRaw = $("#c-price").value;
  if ($("#c-points")) createState.sellingPoints = $("#c-points").value;
  if ($("#c-category")) createState.category = $("#c-category").value;
  if ($("#c-notes")) createState.notes = $("#c-notes").value;
  const st = document.querySelector('input[name="c-style"]:checked');

function sheetRowValidationMessage() {
  if (createState.source !== "sheet") return "";
  const raw = String(createState.sheetRow || "").trim();
  if (!raw) return "";
  const num = parseInt(raw, 10);
  if (num === 1 || num < 2 || Number.isNaN(num)) {
    return "Dòng 1 là dòng tiêu đề cột. Hãy chọn từ dòng số 2 trở đi.";
  }
  return "";
}

function paintSheetSelect() {
  const sel = $("#c-sheet-select");
  if (!sel) return;
  if (!createState.sheetAvailable || !createState.sheetRows.length) {
    sel.innerHTML = `<option value="">${esc(createState.sheetMessage || "Chưa có dòng sản phẩm nào trên Google Sheet")}</option>`;
    return;
  }
  const cur = String(createState.sheetRow || "").trim();
  const opts = ['<option value="">— Chọn nhanh một dòng sản phẩm trên Google Sheet —</option>'];
  for (const r of createState.sheetRows) {
    const priceLabel = r.price ? `${formatVndDots(r.price)}đ` : "Chưa có giá";
    const statusLabel = r.has_video ? "[Đã có video]" : "[Chưa tạo]";
    const selected = String(r.row) === cur ? "selected" : "";
    opts.push(`<option value="${r.row}" ${selected}>Dòng ${r.row} — ${esc(r.name)} (${priceLabel}) ${statusLabel}</option>`);
  }
  sel.innerHTML = opts.join("");
}

    const slot = createState.slots[k];
    if (!slot) {
      return `<div class="slot-card" data-slot="${k}">
        <div class="slot-title">${esc(title)}</div>
        <div class="thumb">Chưa có ảnh</div>
        <div class="acts">
          <button type="button" class="btn small" data-c-upload="${k}">+ Tải ảnh lên</button>
        </div>

    return `<div class="slot-card" data-slot="${k}">
      <div class="slot-title">${esc(title)}</div>
      <img class="thumb" src="${esc(slot.url)}" alt="${esc(title)}">
      <span class="chip">${esc(badgeText)}</span>

        <button type="button" class="btn small" data-c-del="${k}">Xoá</button>

  }).join("");
}

          <div id="c-row-msg">${rowErr ? `<div class="price-preview bad-text">${esc(rowErr)}</div>` : '<div class="hint">Dòng 1 là dòng tiêu đề cột. Các sản phẩm bắt đầu từ dòng 2 trở đi.</div>'}</div>
        `}
        <div class="copy-row" style="margin-top:12px">
          <button type="button" class="btn" id="b-preview" ${busy || !!rowErr ? "disabled" : ""}>
            ${createState.loadingPreview ? '<span class="spinner"></span>Đang đọc thông tin (1–3 giây)…' : "Lấy thông tin sản phẩm"}
          </button>
        </div>
      </div>

      <div class="card">
        <h3>Bước 2: Kiểm tra giá & Ảnh sản phẩm</h3>
        <p class="sub">Kiểm tra kỹ trước khi tạo video để không tốn lượt đọc giọng phải sửa lại.</p>
        <label class="f" for="c-price">Giá sản phẩm hiện trên video (đồng)</label>
        <input type="text" id="c-price" inputmode="numeric" placeholder="Ví dụ: 189.000 (hoặc nhập 0 nếu muốn ẩn giá)" value="${esc(createState.priceRaw)}">
        <div id="c-price-preview">${pricePreviewMarkup(createState.priceRaw, { allowEmpty: true })}</div>

        <label class="f" style="margin-top:16px">Ảnh sản phẩm (tối đa 3 ảnh)</label>
        <div class="hint" style="margin-top:0;margin-bottom:10px">Nên có đủ 3 ảnh rõ nét. Ảnh 1 quan trọng nhất vì sẽ xuất hiện ở cảnh mở đầu và cảnh kêu gọi mua.</div>
        <div class="pimgs" id="c-slots">${createSlotsMarkup()}</div>
      </div>

      <div class="card">
        <h3>Bước 3: Thông tin chi tiết & Kiểu video</h3>
        <p class="sub">Tự điền sau khi bấm Lấy thông tin sản phẩm, hoặc bạn có thể tự nhập/sửa trực tiếp.</p>
        <label class="f" for="c-name">Tên sản phẩm</label>
        <input type="text" id="c-name" placeholder="Ví dụ: Nồi chiên không dầu 5L" value="${esc(createState.name)}">

        <label class="f">Kiểu video</label>
        <div class="style-choices">
          <label class="style-choice">
            <input type="radio" name="c-style" value="story" ${createState.style === "story" ? "checked" : ""}>
            <div><b>Tiểu phẩm câu chuyện</b><span>Có nhân vật đối thoại đời thường rồi giới thiệu sản phẩm.</span></div>
          </label>
          <label class="style-choice">
            <input type="radio" name="c-style" value="simple" ${createState.style === "simple" ? "checked" : ""}>
            <div><b>Giới thiệu ngắn gọn</b><span>Chỉ dùng ảnh sản phẩm và giọng người dẫn, dựng nhanh.</span></div>
          </label>
        </div>

        <label class="f">Giọng đọc</label>
        <div class="style-choices">
          <label class="style-choice">
            <input type="radio" name="c-voice" value="" ${createState.voice !== "edge" ? "checked" : ""}>
            <div><b>Giọng Gemini</b><span>Tự nhiên hơn, tốn lượt Gemini trong ngày (hết lượt thì tự chuyển giọng miễn phí).</span></div>
          </label>
          <label class="style-choice">
            <input type="radio" name="c-voice" value="edge" ${createState.voice === "edge" ? "checked" : ""}>
            <div><b>Giọng miễn phí</b><span>Không tốn lượt Gemini. Hợp khi bạn định chỉnh tiếp trong CapCut.</span></div>
          </label>
        </div>

        <label class="f" for="c-points">Điểm nổi bật (mỗi ý 1 dòng)</label>
        <textarea id="c-points" rows="3" placeholder="Ví dụ:&#10;Lực hút mạnh&#10;Pin sạc USB tiện lợi&#10;Nhỏ gọn dễ cầm">${esc(createState.sellingPoints)}</textarea>

        <label class="f" for="c-category">Danh mục</label>
        <input type="text" id="c-category" value="${esc(createState.category)}">

        <label class="f" for="c-notes">Ghi chú / Lưu ý khi viết kịch bản</label>
        <textarea id="c-notes" rows="2" placeholder="Ví dụ: Không phải thiết bị y tế; khách hàng là người lớn tuổi...">${esc(createState.notes)}</textarea>
      </div>

      <div class="banner info">
        Tạo video mới sẽ dùng khoảng 4 lượt giọng đọc Gemini (mỗi ngày có 10 lượt miễn phí; hết lượt máy tự chuyển sang giọng miễn phí). Hãy kiểm tra kỹ Giá và Ảnh sản phẩm trước khi bấm.
      </div>
    </div>`;

  if (!isUrl) paintSheetSelect();
  bindCreateEvents();
  updateCreateBar();
}

function bindCreateEvents() {
  $("#back")?.addEventListener("click", async () => {
    if (!(await leaveOk())) return;
    current = null; mode = null; dirty = false; banner = null;
    history.replaceState(null, "", location.pathname);
    document.body.classList.remove("has-detail");
    $("#bar").hidden = true;
    $("#main").innerHTML = '<p class="empty">Chọn một video ở danh sách bên trái hoặc bấm <b>+ Tạo video mới</b>.</p>';
    loadList();
  });

  $("#tab-url")?.addEventListener("click", () => {
    syncCreateDomToState();
    createState.source = "url";
    renderCreate();
  });
  $("#tab-sheet")?.addEventListener("click", () => {
    syncCreateDomToState();
    createState.source = "sheet";
    renderCreate();
  });

  $("#c-sheet-select")?.addEventListener("change", (e) => {
    createState.sheetRow = e.target.value;
    if ($("#c-sheet-row")) $("#c-sheet-row").value = e.target.value;
    updateCreateRowMsg();
    updateCreateBar();
  });
  $("#c-sheet-row")?.addEventListener("input", (e) => {
    createState.sheetRow = e.target.value;
    if ($("#c-sheet-select")) $("#c-sheet-select").value = e.target.value;
    updateCreateRowMsg();
    updateCreateBar();
  });

  $("#c-price")?.addEventListener("input", (e) => {
    createState.priceRaw = e.target.value;
    const prev = $("#c-price-preview");
    if (prev) prev.innerHTML = pricePreviewMarkup(createState.priceRaw, { allowEmpty: true });
    updateCreateBar();
  });

  $("#b-preview")?.addEventListener("click", () => fetchProductPreview());

  $("#main").querySelectorAll("input, textarea").forEach((el) => {
    el.addEventListener("input", () => {
      syncCreateDomToState();
      updateCreateBar();
    });
  });

  bindCreateSlotEvents();
}

function updateCreateRowMsg() {
  const msgEl = $("#c-row-msg");
  const err = sheetRowValidationMessage();
  if (msgEl) {
    msgEl.innerHTML = err
      ? `<div class="price-preview bad-text">${esc(err)}</div>`
      : '<div class="hint">Dòng 1 là dòng tiêu đề cột. Các sản phẩm bắt đầu từ dòng 2 trở đi.</div>';
  }
  const btn = $("#b-preview");
  if (btn) btn.disabled = jobBusy() || createState.loadingPreview || !!err;
}

function bindCreateSlotEvents() {
  const root = $("#c-slots");
  if (!root) return;
  root.querySelectorAll("[data-c-upload]").forEach((b) =>
    b.addEventListener("click", () => pickStagingImage(+b.dataset.cUpload))
  );
  root.querySelectorAll("[data-c-del]").forEach((b) =>
    b.addEventListener("click", () => removeStagingImage(+b.dataset.cDel))
  );
}

async function fetchProductPreview() {
  syncCreateDomToState();
  const rowErr = sheetRowValidationMessage();
  if (rowErr) { showBanner("bad", rowErr); return; }
  if (createState.source === "url" && !createState.productUrl.trim()) {
    showBanner("bad", "Hãy dán link sản phẩm TikTok Shop trước khi bấm Lấy thông tin sản phẩm.");
    $("#c-url")?.focus();
    return;
  }
  if (createState.source === "sheet" && !String(createState.sheetRow || "").trim()) {
    showBanner("bad", "Hãy chọn một dòng hoặc nhập số dòng trên Google Sheet (bắt đầu từ dòng 2).");
    $("#c-sheet-row")?.focus();
    return;
  }
  createState.loadingPreview = true;
  renderCreate();
  try {
    const payload = createState.source === "sheet"
      ? { source: "sheet", sheet_row: parseInt(createState.sheetRow, 10) }
      : { source: "url", product_url: createState.productUrl.trim() };
    const res = await api("/product-preview", { method: "POST", json: payload });
    if (res.name) createState.name = res.name;
    if (!res.blocked) {
      createState.priceRaw = res.price ? formatVndDots(res.price) : (createState.priceRaw || "");
    }
    const imgs = res.images || [];
    createState.slots = [0, 1, 2].map((k) =>
      imgs[k] ? { url: imgs[k], source: imgs[k], uploaded: false } : null
    );
    if (res.selling_points) createState.sellingPoints = res.selling_points;
    if (res.category) createState.category = res.category;
    if (res.notes !== undefined && res.notes !== null && res.notes !== "") createState.notes = res.notes;

    if (res.warning) {
      banner = { kind: "warn", html: esc(res.warning) };
    } else {
      banner = { kind: "ok", html: "Đã lấy thông tin sản phẩm. Hãy kiểm tra lại Giá và Ảnh sản phẩm ở Bước 2 trước khi bấm Tạo video." };
    }
    createState.loadingPreview = false;
    renderCreate();
    if (res.blocked || !createState.name.trim()) {
      $("#c-name")?.focus();
    }
  } catch (e) {
    createState.loadingPreview = false;
    showBanner("bad", e.message);
    renderCreate();
  }
}

function pickStagingImage(slot) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/png,image/jpeg,image/webp";
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { showBanner("bad", "Ảnh quá lớn (tối đa 15 MB)."); return; }
    syncCreateDomToState();
    try {
      const res = await api(`/staging-image?slot=${slot}`, {
        method: "POST",
        body: file,
        headers: { "Content-Type": "application/octet-stream" },
      });
      createState.slots[slot] = { url: res.url, source: res.name, uploaded: true };
      const slotsEl = $("#c-slots");
      if (slotsEl) { slotsEl.innerHTML = createSlotsMarkup(); bindCreateSlotEvents(); }
      updateCreateBar();
    } catch (e) { showBanner("bad", e.message); }
  };
  input.click();
}

async function removeStagingImage(slot) {
  syncCreateDomToState();
  try {
    await api(`/staging-image?slot=${slot}`, { method: "DELETE" });
    createState.slots[slot] = null;
    const slotsEl = $("#c-slots");
    if (slotsEl) { slotsEl.innerHTML = createSlotsMarkup(); bindCreateSlotEvents(); }
    updateCreateBar();
  } catch (e) { showBanner("bad", e.message); }
}

function updateCreateBar() {
  if (mode !== "create") return;
  const bar = $("#bar");
  const busy = jobBusy() || createState.loadingPreview;
  const p = parsePriceRaw(createState.priceRaw);
  const rowErr = sheetRowValidationMessage();
  const hasSource = createState.source === "sheet"
    ? (String(createState.sheetRow || "").trim() !== "" && !rowErr)
    : (createState.productUrl.trim() !== "" || createState.name.trim() !== "");
  const canCreate = !busy && !p.invalid && !rowErr && hasSource;

  let why;
  if (busy) why = "Đang xử lý, đợi một chút…";
  else if (rowErr) why = rowErr;
  else if (p.invalid) why = "Giá sản phẩm chưa hợp lệ (nhập từ 1.000đ trở lên, hoặc nhập 0 để ẩn giá).";
  else if (!hasSource) why = "Chọn nguồn sản phẩm ở Bước 1, kiểm tra Giá & Ảnh ở Bước 2 rồi bấm Tạo video.";
  else why = "Tạo video mới dùng ~4 lượt giọng Gemini (10 lượt miễn phí/ngày). Kiểm tra kỹ Giá & Ảnh trước khi bấm.";

  bar.hidden = false;
  bar.innerHTML = `<span class="why">${esc(why)}</span>
    <button class="btn primary" id="b-create" ${canCreate ? "" : "disabled"}>Tạo video</button>`;
  $("#b-create").onclick = () => startCreate();
}

async function startCreate() {
  syncCreateDomToState();
  const p = parsePriceRaw(createState.priceRaw);
  if (p.invalid) {
    showBanner("bad", "Giá đang dưới 1.000đ. Kiểm tra lại xem bạn có gõ thiếu 3 số 0 (ví dụ 189.000) không, hoặc nhập 0 nếu muốn ẩn giá.");
    return;
  }
  const rowErr = sheetRowValidationMessage();
  if (rowErr) { showBanner("bad", rowErr); return; }

  const activeImages = createState.slots.filter(Boolean).map((s) => s.source);
  const payload = {
    sheet_row: createState.source === "sheet" && String(createState.sheetRow || "").trim()
      ? parseInt(createState.sheetRow, 10)
      : null,
    product_url: createState.source === "url" ? (createState.productUrl.trim() || null) : null,
    name: createState.name.trim() || null,
    price: p.empty ? null : p.value,
    images: activeImages.length ? activeImages : null,
    style: createState.style || "simple",
    category: createState.category.trim() || "Nhà cửa",
    selling_points: createState.sellingPoints.trim() || null,
    notes: createState.notes.trim() || null,
    voice: createState.voice || null,
  };
  try {
    await api("/create", { method: "POST", json: payload });
    watchJob();
  } catch (e) {
    showBanner("bad", e.message);
    if (/Tên sản phẩm/i.test(e.message)) $("#c-name")?.focus();
  }
}

// ---------------- detail ----------------
function render() {
  const v = current, main = $("#main");
  const head = `
    <button class="btn small back" id="back">← Danh sách</button>
    <div class="title-row"><h2>${esc(v.title)}</h2><span class="badge b-${v.label}">${LABELS[v.label]}</span></div>
    <div id="banner">${banner ? bannerMarkup() : ""}</div>${v.kind === "travel" ? travelStaleBanner(v) : ""}
    <div id="voiceline"></div>`;
  const player = `<div class="player"><video id="vid" controls playsinline preload="metadata" src="${esc(v.video_url)}#t=0.1"></video></div>`;

  if (v.label === "view_only") {
    main.innerHTML = head + `<div class="detail">${player}<div>
      <div class="card"><h3>Chữ đăng kèm video</h3>
        <p class="sub">Video này làm bằng công cụ khác nên chỉ xem được, không sửa được ở đây.</p>
        <textarea readonly rows="4">${esc(v.post_text)}</textarea>
        <div class="copy-row"><button class="btn small" data-copy="post">Chép chữ đăng kèm</button></div>
      </div></div></div>`;
    $("#bar").hidden = true;
    bindCommon();
    return;
  }

  const initialPriceStr = v.price ? formatVndDots(v.price) : "0";
  main.innerHTML = head + `<div class="detail">${player}<div>
    <div id="voicenote"></div>
    <div class="card">
      <h3>Chữ đăng kèm video</h3>
      <p class="sub">Dán vào TikTok khi đăng. Sửa phần này không cần dựng lại video.</p>
      <label class="f" for="caption">Lời giới thiệu</label>
      <textarea id="caption" rows="3">${esc(v.caption)}</textarea>
      <label class="f" for="hashtags">Hashtag</label>
      <input type="text" id="hashtags" value="${esc(v.hashtags)}">
      <div class="hint">Cách nhau bằng dấu cách, ví dụ: #botmeden #tiktokshop</div>
      <div class="copy-row"><button class="btn small" data-copy="post">Chép chữ đăng kèm</button></div>
    </div>
    <div class="card">
      <h3>Chữ trên video</h3>
      <p class="sub">Sửa phần này xong cần bấm <b>Dựng lại video</b>.</p>
      ${v.kind === "travel" ? "" : `<label class="f" for="hook">Câu mở đầu (chữ lớn ở cảnh 1)</label>
      <input type="text" id="hook" value="${esc(v.hook)}">`}
      ${v.kind === "travel" ? "" : `<label class="f" for="price">Giá hiện trên video (đồng)</label>
      <input type="text" id="price" inputmode="numeric" value="${esc(initialPriceStr)}">
      <div id="price-preview">${pricePreviewMarkup(initialPriceStr, { allowEmpty: false, oldPrice: v.price })}</div>`}
    </div>
    <div class="card">
      <h3>Từng cảnh</h3>
      <p class="sub">Lời đọc là câu giọng nói sẽ đọc. Câu nào sửa thì chỉ câu đó được đọc lại.</p>
      ${v.segments.map(sceneMarkup).join("")}
    </div>
    ${v.kind === "travel" ? travelCards(v) : `<div class="card">
      <h3>Ảnh sản phẩm</h3>
      <p class="sub">Video dùng tối đa 3 ảnh. Ảnh đầu tiên dùng cho cảnh mở đầu và cảnh kêu gọi mua.</p>
      <div class="pimgs">${productImagesMarkup()}</div>
    </div>`}
  </div></div>`;
  bindCommon();
  main.querySelectorAll("input, textarea").forEach((el) => el.addEventListener("input", () => {
    dirty = true;
    if (el.id === "price" && $("#price-preview")) {
      $("#price-preview").innerHTML = pricePreviewMarkup($("#price").value, { allowEmpty: false, oldPrice: v.price });
    }
    updateBar();
  }));
  updateBar();
}

function sceneMarkup(s) {
  if (current.kind === "travel") return travelSceneMarkup(s);
  const first = s.index === 0;
  const tag = first ? "Mở đầu" : KINDS[s.kind] || "Cảnh";
  const showText = s.kind === "product" && !first;
  let img = "";
  if (s.kind === "story") {
    const thumb = s.image_url ? `<img class="thumb" src="${esc(s.image_url)}" alt="Ảnh cảnh ${s.index + 1}">`
                              : `<div class="thumb">Chưa có ảnh</div>`;
    img = `<div class="scene-img">${thumb}<div><div class="acts">
      <button class="btn small" data-upload="scene" data-index="${s.index}">${s.image_url ? "Đổi ảnh" : "Tải ảnh lên"}</button>
      ${s.image_prompt ? `<button class="btn small" data-prompt="${s.index}">Chép gợi ý tạo ảnh</button>` : ""}</div>
      <div class="hint">Ảnh dọc, người Việt, không có chữ trong ảnh.</div></div></div>`;
  }
  return `<div class="scene" data-scene="${s.index}">
    <div class="scene-head"><b>Cảnh ${s.index + 1}</b><span class="chip">${esc(tag)}</span>
      <span class="chip">${esc(SPEAKERS[s.speaker] || s.speaker)}</span>
      <span class="chip re" data-re hidden>Sẽ đọc lại</span></div>
    <label class="f" for="line-${s.index}">Lời đọc</label>
    <textarea id="line-${s.index}" rows="2" data-line="${s.index}">${esc(s.line)}</textarea>
    ${showText ? `<label class="f" for="text-${s.index}">Chữ trên màn hình (ngắn, tối đa 4 từ)</label>
      <input type="text" id="text-${s.index}" data-text="${s.index}" value="${esc(s.text)}">` : ""}
    ${img}</div>`;
}

function productImagesMarkup() {
  const imgs = current.product_images;
  const slots = imgs.map((p) => `<div class="pimg">
      ${p.url ? `<img class="thumb" src="${esc(p.url)}" alt="Ảnh sản phẩm ${p.slot + 1}">` : `<div class="thumb">Ảnh trên máy</div>`}
      <button class="btn small" data-upload="product" data-index="${p.slot}">Thay ảnh ${p.slot + 1}</button></div>`);
  if (imgs.length < 3) slots.push(`<div class="pimg"><div class="thumb">Trống</div>
      <button class="btn small" data-upload="product" data-index="${imgs.length}">Thêm ảnh</button></div>`);
  return slots.join("");
}

function bindCommon() {
  paintVoice();
  $("#back")?.addEventListener("click", async () => {
    if (!(await leaveOk())) return;
    current = null; mode = null; dirty = false; banner = null;
    history.replaceState(null, "", location.pathname);
    document.body.classList.remove("has-detail");
    $("#bar").hidden = true;
    $("#main").innerHTML = '<p class="empty">Chọn một video ở danh sách bên trái hoặc bấm <b>+ Tạo video mới</b>.</p>';
    loadList();
  });
  $("#main").querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => {
    const text = current.label === "view_only" ? current.post_text
      : `${$("#caption").value.trim()} ${$("#hashtags").value.trim()}`.trim();
    copy(text, b);
  }));
  $("#main").querySelectorAll("[data-prompt]").forEach((b) => b.addEventListener("click", () => {
    copy(current.segments[+b.dataset.prompt].image_prompt, b);
  }));
  $("#main").querySelectorAll("[data-upload]").forEach((b) =>
    b.addEventListener("click", () => pickImage(b.dataset.upload, +b.dataset.index)));
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
  const old = btn.textContent; btn.textContent = "Đã chép ✓"; setTimeout(() => (btn.textContent = old), 1500);
}

function formValues() {
  const p = $("#price") ? parsePriceRaw($("#price").value) : { empty: false, value: null, invalid: false };
  return {
    caption: $("#caption").value,
    hashtags: $("#hashtags").value,
    hook: $("#hook") ? $("#hook").value : current.hook,
    price: $("#price") ? (p.empty ? 0 : p.value) : current.price,
    priceInvalid: p.invalid,
    segments: current.segments.map((s) => ({
      line: $(`[data-line="${s.index}"]`).value,
      text: $(`[data-text="${s.index}"]`)?.value ?? s.text,
      ...(current.kind === "travel" ? { subs: travelSubsOf(s) } : {}),
    })),
  };
}

function changedLines() {
  return current.segments.filter((s) => norm($(`[data-line="${s.index}"]`).value) !== norm(s.audio_line)).map((s) => s.index);
}

function formNeedsRender() {
  const f = formValues(), v = current;
  if (norm(f.hook) !== norm(v.hook) || f.price !== v.price) return true;
  return v.segments.some((s, i) => norm(f.segments[i].line) !== norm(s.line) || f.segments[i].text.trim() !== (s.text || "")
    || (v.kind === "travel" && travelSubsChanged(s, f.segments[i].subs)));
}

function jobBusy() { return !!polling; }

function updateBar() {
  const v = current, bar = $("#bar");
  if (mode === "create") { updateCreateBar(); return; }
  if (!v || v.label === "view_only") { bar.hidden = true; return; }
  const changed = changedLines();
  document.querySelectorAll("[data-scene]").forEach((el) => {
    el.querySelector("[data-re]").hidden = !changed.includes(+el.dataset.scene);
  });
  // Cost of re-voicing, shown before the button is pressed. Edited lines are re-voiced with the
  // video's own Gemini voice only, so the count is that voice's, not the whole chain's.
  let note = "";
  if (changed.length) {
    const k = changed.length;
    const guess = v.voice_engine_known ? "" : " (Video này làm trước khi có Studio, máy đoán theo cài đặt hiện tại.)";
    const row = quota.available ? modelRow(v.voice_model) : null;
    if (v.voice_engine !== "gemini") {
      note = `<div class="banner info">Bạn sửa ${k} lời đọc. Video dùng giọng miễn phí, không giới hạn lượt.${guess}</div>`;
    } else if (!row) {
      note = `<div class="banner info">Bạn sửa ${k} lời đọc. Dựng lại sẽ dùng <b>${k} lượt</b> giọng Gemini của video này.${guess}</div>`;
    } else if (row.left >= k) {
      const after = row.left - k, per = quota.calls_per_video || 4;
      const videosAfter = row.role === "other" ? quota.videos_left
        : quota.videos_left - Math.floor(row.left / per) + Math.floor(after / per);
      const tail = videosAfter < 1 ? ` Sau đó không đủ lượt Gemini cho một video mới trước ${esc(about(quota.resets_at))}.` : "";
      note = `<div class="banner info">Bạn sửa ${k} lời đọc. Dựng lại sẽ dùng <b>${k} lượt</b> giọng Gemini của video này. Hiện còn ${row.left}, sau khi dựng còn ${after}.${tail}${guess}</div>`;
    } else {
      note = `<div class="banner bad">Bạn sửa ${k} lời đọc nhưng giọng Gemini của video này chỉ còn ${row.left} lượt. Chọn một cách: sửa ít câu hơn; đợi đến ${esc(about(backAt(row)))}; hoặc đọc lại toàn bộ bằng giọng miễn phí.${guess}
        <div class="acts"><button class="btn small" data-act="revoice" ${jobBusy() ? "disabled" : ""}>Đọc lại toàn bộ bằng giọng miễn phí</button></div></div>`;
    }
  }
  if (v.kind === "travel") note += travelEditNote();
  if ($("#voicenote").innerHTML !== note) $("#voicenote").innerHTML = note;

  const busy = jobBusy();
  const priceInvalid = parsePriceRaw($("#price")?.value).invalid;
  const needsRender = v.needs_render || (dirty && formNeedsRender());
  let why;
  if (busy) why = "Đang chạy, đợi một chút…";
  else if (priceInvalid) why = "Giá đang dưới 1.000đ. Kiểm tra lại số 0 hoặc nhập 0 nếu muốn ẩn giá.";
  else if (dirty && needsRender) why = "Có thay đổi chưa lưu. Bấm Dựng lại video để lưu và xem kết quả.";
  else if (dirty) why = "Có thay đổi chưa lưu.";
  else if (v.needs_render) why = "Video chưa cập nhật theo chỗ bạn vừa sửa. Bấm Dựng lại video.";
  else if (v.label === "needs_images") why = "Còn cảnh chưa có ảnh nhân vật. Tải ảnh lên rồi dựng lại.";
  else if (v.label === "approved") why = "Video này đã duyệt trước đó.";
  else why = "Xem hết video. Đạt thì bấm Duyệt & lưu.";
  const stale = v.kind === "travel" && (v.stale_ids || []).length > 0;
  if (stale && !busy && !dirty && !v.needs_render) why = "Cần làm mới nguồn trước khi duyệt (xem khung vàng ở đầu trang).";
  const canApprove = !busy && !dirty && !priceInvalid && !v.needs_render && v.label !== "needs_images" && !stale;
  bar.hidden = false;
  bar.innerHTML = `<span class="why">${esc(why)}</span>
    <button class="btn" id="b-save" ${!dirty || busy || priceInvalid ? "disabled" : ""}>Lưu thay đổi</button>
    <button class="btn ${needsRender && !busy && !priceInvalid ? "primary" : ""}" id="b-render" ${busy || priceInvalid ? "disabled" : ""}>Dựng lại video</button>
    ${v.kind !== "travel" ? `<button class="btn" id="b-capcut" ${busy || dirty || v.needs_render ? "disabled" : ""} title="${v.capcut ? "Đã xuất: " + esc(v.capcut.draft_name || "") : "Tạo dự án CapCut từ video này để chỉnh tiếp"}">${v.capcut ? "Xuất lại sang CapCut" : "Xuất sang CapCut"}</button>` : ""}
    <button class="btn ${canApprove ? "primary" : ""}" id="b-approve" ${canApprove ? "" : "disabled"}>${stale ? "Cần làm mới nguồn trước" : "Duyệt &amp; lưu"}</button>`;
  $("#b-save").onclick = () => save().then(() => { showBanner("ok", "Đã lưu."); render(); }).catch((e) => showBanner("bad", e.message));
  $("#b-render").onclick = () => startRender();
  $("#b-approve").onclick = () => askApprove();
  if ($("#b-capcut")) $("#b-capcut").onclick = () => startCapcut();
}

async function startCapcut() {
  try {
    await api(`/videos/${encodeURIComponent(current.folder)}/capcut`, { method: "POST" });
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

async function save() {
  if (!dirty) return;
  const vals = formValues();
  if (vals.priceInvalid) {
    throw new Error("Giá đang dưới 1.000đ. Kiểm tra lại xem bạn có gõ thiếu 3 số 0 (ví dụ 189.000) không, hoặc nhập 0 nếu muốn ẩn giá.");
  }
  delete vals.priceInvalid;
  current = await api("/videos/" + encodeURIComponent(current.folder), { method: "PUT", json: vals });
  dirty = false;
  say("Đã lưu");
}

function pickImage(target, index) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/png,image/jpeg,image/webp";
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 15 * 1024 * 1024) { showBanner("bad", "Ảnh quá lớn (tối đa 15 MB)."); return; }
    try {
      await save();
      current = await api(`/videos/${encodeURIComponent(current.folder)}/image?target=${target}&index=${index}`,
        { method: "POST", body: file, headers: { "Content-Type": "application/octet-stream" } });
      banner = { kind: "warn", html: "Đã nhận ảnh. Bấm <b>Dựng lại video</b> để đưa ảnh vào video." };
      render();
    } catch (e) { showBanner("bad", e.message); }
  };
  input.click();
}

// ---------------- jobs ----------------
async function startRender(revoiceAll) {
  try {
    await save();
    // revoiceAll: "edge" (free voice) | "gemini" | undefined (only the edited lines)
    await api(`/videos/${encodeURIComponent(current.folder)}/render`, { method: "POST", json: revoiceAll ? { revoice_all: revoiceAll } : {} });
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

async function askApprove() {
  // A video that is not on the main Gemini voice is pointed out before it is approved:
  // after approval the folder may be gone and the voice cannot be changed any more.
  const extra = current.voice_role === "free" ? "Video này dùng giọng miễn phí. Sau khi duyệt không đổi giọng được nữa."
    : current.voice_role === "backup" ? "Video này dùng giọng Gemini phụ. Bạn đã nghe kỹ chưa?" : "";
  const ok = await ask({
    title: "Duyệt video này?",
    text: drive
      ? "Máy sẽ lưu chữ đăng kèm, tải cả thư mục video lên Google Drive, rồi xoá bản trên máy. Sau đó video không còn trong danh sách này."
      : "Máy sẽ lưu chữ đăng kèm và danh sách việc cần làm khi đăng vào thư mục video, rồi đánh dấu Đã duyệt. Video vẫn giữ trên máy.",
    extra, yes: "Duyệt & lưu" });
  if (!ok) return;
  try {
    await api(`/videos/${encodeURIComponent(current.folder)}/approve`, { method: "POST" });
    watchJob();
  } catch (e) { showBanner("bad", e.message); }
}

function stepText(job) {
  const log = job.log.join("\n");
  if (job.action === "approve") return /Drive|Upload/i.test(log) ? "Đang tải lên Google Drive…" : "";
  if (/Rendering video|Scene \d/.test(log)) return "Đang dựng hình…";
  if (/voic/i.test(log)) return "Đang tạo giọng đọc…";
  if (/Generating .* script/i.test(log)) return "Đang viết kịch bản…";
  if (job.action === "create") return "Đang đọc thông tin sản phẩm…";
  return "Đang chuẩn bị…";
}

function watchJob() {
  clearInterval(polling);
  const tick = async () => {
    let job;
    try { job = await api("/job"); } catch { return; }
    if (job.state === "running") {
      let what;
      if (job.action === "approve") what = "Đang duyệt.";
      else if (job.action === "capcut") what = "Đang tạo dự án CapCut, chỉ mất vài giây.";
      else if (job.action === "create") what = "Đang tạo video mới, thường mất 2–3 phút.";
      else what = "Đang dựng lại video, thường mất 1–2 phút.";
      banner = { kind: "job", html: `<span class="spinner"></span>${what} ${esc(stepText(job))}` };
      paintBanner();
      return;
    }
    clearInterval(polling); polling = null;
    if (job.state === "idle") { banner = null; paintBanner(); return; }
    await jobFinished(job);
  };
  polling = setInterval(tick, 2000);
  tick();
}

async function jobFinished(job) {
  const log = `<details><summary>Xem chi tiết kỹ thuật</summary><pre>${esc(job.log.join("\n"))}</pre></details>`;
  const driveLink = job.drive_link ? ` <a href="${esc(job.drive_link)}" target="_blank" rel="noopener">Mở thư mục Drive</a>` : "";
  await loadQuota();  // the job may have used Gemini requests, or learned that a voice ran out
  if (job.state === "done" && job.action === "create") {
    banner = { kind: "ok", html: "Đã tạo xong video mới. Xem hết video và kiểm tra lời đọc trước khi bấm Duyệt & lưu." };
    await loadList();
    if (job.folder && videos.some((v) => v.folder === job.folder)) {
      await openVideo(job.folder, true);
    } else if (videos.length) {
      await openVideo(videos[0].folder, true);
    }
    say("Đã tạo xong video mới");
  } else if (job.action === "capcut") {
    const logText = job.log.join("\n");
    if (job.state === "done") {
      const m = logText.match(/"draft_name":\s*"([^"]+)"/);
      banner = { kind: "ok", html: `Đã tạo dự án CapCut <b>${esc(m ? m[1] : "")}</b>. Thoát hẳn CapCut (Cmd+Q) rồi mở lại để thấy dự án.` };
      say("Đã xuất sang CapCut");
    } else if (/capcut-mcp/.test(logText)) {
      banner = { kind: "bad", html: "Máy chưa cài công cụ CapCut. Mở Terminal trong thư mục dự án và chạy: <code>.venv/bin/pip install -e tools/capcut-mcp</code>" + log };
    } else {
      banner = { kind: "bad", html: "Chưa xuất sang CapCut được. Video trên Studio vẫn nguyên, bạn vẫn dùng được video.mp4." + log };
    }
    await openVideo(job.folder, true);
  } else if (job.state === "done" && job.action === "render") {
    banner = { kind: "ok", html: "Đã dựng xong. Xem lại video." };
    await openVideo(job.folder, true);
    say("Đã dựng xong video");
  } else if (job.state === "done" && job.action === "approve") {
    if (job.folder_kept) {
      banner = { kind: "ok", html: "Đã duyệt. Chữ đăng kèm đã lưu cạnh video." + driveLink };
      await openVideo(job.folder, true);
    } else {
      current = null; mode = null; dirty = false; banner = null;
      document.body.classList.remove("has-detail");
      $("#bar").hidden = true;
      $("#main").innerHTML = `<div class="banner ok">Đã duyệt và chuyển video lên Google Drive.${driveLink}</div>`;
      document.body.classList.add("has-detail");
      await loadList();
    }
    say("Đã duyệt video");
  } else if (job.action === "create") {
    banner = {
      kind: "bad",
      html: "Tạo video chưa thành công. Bạn hãy kiểm tra lại thông tin ở dưới rồi bấm Tạo video để thử lại." + log,
    };
    if (mode !== "create") {
      await openCreate(true);
    } else {
      paintBanner();
      updateCreateBar();
    }
  } else if (job.error_kind === "revoice" && current && current.kind === "travel") {
    banner = { kind: "bad", html: "Không đọc lại được câu đã sửa bằng giọng miễn phí, thường do mạng chập chờn hoặc dịch vụ giọng đang bận. Video và giọng cũ vẫn giữ nguyên. Kiểm tra mạng rồi bấm Dựng lại video thử lần nữa." + log };
    await openVideo(job.folder, true);
  } else if (job.error_kind === "revoice") {
    const same = current && current.folder === job.folder;
    const logText = job.log.join("\n");
    const freeVideo = same && current.voice_engine !== "gemini";
    if (freeVideo && !/gemini TTS quota/.test(logText)) {
      // The free voice itself failed (network); there is no other voice to offer.
      banner = { kind: "bad", html: "Không đọc lại được câu đã sửa bằng giọng miễn phí. Video và giọng cũ vẫn giữ nguyên. Đợi ít phút rồi bấm Dựng lại video." + log };
    } else if (freeVideo) {
      // "Đọc lại toàn bộ bằng giọng Gemini" was asked for a free-voice video, and Gemini is short.
      const wait = esc(quota.available ? about(chainBackAt(current.voice_calls || 0)) : "khi có lại lượt");
      banner = { kind: "bad", html: `Giọng Gemini không đủ lượt nên máy chưa đọc lại câu nào. Video vẫn dùng giọng miễn phí như cũ. Đợi đến ${wait} rồi thử lại.` + log };
    } else {
      const wait = esc(about(backAt(quota.available && same ? modelRow(current.voice_model) : null)));
      // "no API call made": demo.py's own count said the voice was short, Gemini was not asked.
      const what = /no API call made/.test(logText)
        ? "Giọng Gemini không đủ lượt nên máy chưa đọc lại câu nào."
        : "Gemini báo đã hết lượt dù máy đếm còn.";
      banner = { kind: "bad", html: `${what} Video và giọng cũ vẫn giữ nguyên. Đợi đến ${wait} rồi dựng lại, hoặc đọc lại toàn bộ bằng giọng miễn phí.`
        + `<div class="acts"><button class="btn small" data-act="revoice">Đọc lại toàn bộ bằng giọng miễn phí</button></div>`
        + `<div class="hint">Cả video phải dùng chung một giọng, nên không đổi riêng được câu đã sửa.</div>` + log };
    }
    await openVideo(job.folder, true);
  } else if (job.error_kind === "drive_failed") {
    const n = (job.notices || []).filter((l) => l.startsWith("[DRIVE_FAILED] ")).map((l) => l.replace(/^\[DRIVE_FAILED\]\s*/, ""));
    banner = { kind: "bad", html: "Duyệt xong nhưng chưa tải lên Drive được. Video vẫn còn trên máy; kiểm mạng / đăng nhập Drive rồi bấm Duyệt lại."
      + (n.length ? `<pre>${esc(n.slice(-3).join("\n"))}</pre>` : "") + log };
    await openVideo(job.folder, true);
  } else if (job.error_kind === "fact_check" || job.error_kind === "facts_stale") {
    banner = { kind: "bad", html: travelErrorHtml(job) + log };
    await openVideo(job.folder, true);
  } else if (job.error_kind === "not_ready") {
    banner = { kind: "bad", html: "Chưa duyệt được: video cần dựng lại, hoặc còn cảnh thiếu ảnh nhân vật." + log };
    await openVideo(job.folder, true);
  } else {
    banner = { kind: "bad", html: (job.action === "approve" ? "Duyệt bị lỗi." : "Dựng lại video bị lỗi.")
      + " Thư mục video vẫn còn nguyên, có thể thử lại." + log };
    if (videos.some((v) => v.folder === job.folder)) await openVideo(job.folder, true); else paintBanner();
  }
}

// ---------------- banner ----------------
function bannerMarkup() {
  const cls = banner.kind === "job" ? "info" : banner.kind;
  return `<div class="banner ${cls}" role="status">${banner.html}</div>`;
}
function showBanner(kind, text) { banner = { kind, html: esc(text) }; paintBanner(); }
function paintBanner() {
  const el = $("#banner");
  if (el) el.innerHTML = banner ? bannerMarkup() : "";
  else if (banner) $("#main").insertAdjacentHTML("afterbegin", `<div id="banner">${bannerMarkup()}</div>`);
  if (mode === "create") updateCreateBar();
  else if (current) { paintVoice(); updateBar(); }  // buttons with data-act are handled by one document listener
}

window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

(async () => {
  loadQuota();
  try { await loadList(); }
  catch (e) { $("#list").innerHTML = `<li class="empty">${esc(e.message)}</li>`; return; }
  const job = await api("/job").catch(() => ({ state: "idle" }));
  const hash = decodeURIComponent(location.hash.slice(1));
  if (job.state === "running" && job.action === "create") {
    await openCreate(true);
    watchJob();
    return;
  }
  const wanted = job.state === "running" ? job.folder : hash;
  if (wanted === "new") await openCreate();
  else if (wanted && videos.some((v) => v.folder === wanted)) await openVideo(wanted);
  if (job.state === "running") watchJob();
})();
</script>
